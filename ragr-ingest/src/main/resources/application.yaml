spring:
  application:
    name: ragr-ingest
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB
  datasource:
    url: jdbc:postgresql://localhost:5432/ragdatabase
    username: myuser
    password: secret
    hikari:
      pool-name: ragr-ingest-hikari-pool
      maximum-pool-size: 20          # app.ingestion.concurrency must stay well below this
      minimum-idle: 5                # below maximum-pool-size, or idle connections are never closed
      connection-timeout: 30000      # 30s - fail rather than wait forever for a connection
      idle-timeout: 300000           # 5m
      keepalive-time: 120000         # 2m - keeps idle connections from being dropped by the network
      max-lifetime: 1800000          # 30m - below any lifetime the database or a proxy enforces
      validation-timeout: 5000
      leak-detection-threshold: 60000
      data-source-properties:
        reWriteBatchedInserts: true  # collapse JDBC batches into one multi-row INSERT
  ai:
    # Nothing here generates; the chat model belongs to ragr-app.
    model:
      chat: none
    retry:
      backoff:
        initial-interval: 2000
        max-interval: 10000
        multiplier: 2
      max-attempts: 3
    # The embedding model and dimensions MUST match ragr-app's, which embeds each question to search
    # what this application wrote. A different dimension fails loudly; a different model with the same
    # dimension fails silently, with poor matches. Changing either means changing ragr-app too and
    # re-ingesting every document.
    vectorstore:
      pgvector:
        table-name: vector_store
        schema-name: public
        initialize-schema: false     # created by this application's Flyway V1
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768              # nomic-embed-text
    ollama:
      base-url: http://localhost:11434
      embedding:
        model: nomic-embed-text
        keep-alive: "-1"   # keep the model loaded: no ~28s cold start, and no startup race for batches

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: "health,metrics,prometheus"
  observations:
    key-values:
      application: ${spring.application.name}
  server:
    port: 9097
  # The Spring Boot 4 key. The old management.otlp.tracing.endpoint is accepted silently but ignored,
  # and with it no traces reached Tempo at all.
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: "http://localhost:4318/v1/traces"
  tracing:
    sampling:
      probability: 1.0
  prometheus:
    metrics:
      export:
        enabled: true
        step: 5s
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
      env: local
    distribution:
      # Histograms only for the timers a dashboard takes percentiles from. The keys match by PREFIX, so
      # each timer's `.active` twin must be switched off explicitly.
      percentiles-histogram:
        "[http.server.requests]": true
        "[gen_ai.client.operation]": true
        "[db.vector.client.operation]": true
        "[http.server.requests.active]": false
        "[gen_ai.client.operation.active]": false
        "[db.vector.client.operation.active]": false
      # Where the buckets stop. The default, 30s, is far shorter than one upload (~240s for the manual),
      # so every upload read as 30s. 900s covers a file near the 25MB limit.
      maximum-expected-value:
        "[http.server.requests]": 900s
        "[gen_ai.client.operation]": 300s
        "[db.vector.client.operation]": 300s
    enable:
      all: true

loki:
  url: http://localhost:3100/loki/api/v1/push

logging:
  level:
    org:
      springframework:
        ai:
          vectorstore: DEBUG
        jdbc:
          core: DEBUG

app:
  embedding:
    # Added to every chunk sent to the embedding model, never stored. nomic-embed-text was trained with
    # "search_document: " on passages and "search_query: " on questions, and Ollama adds neither. MUST
    # pair with ragr-app's question prefix and change with the model (EmbeddingGemma's pair is
    # "title: none | text: " and "task: search result | query: "). Changing it means re-ingesting.
    task-prefix: "search_document: "
  ingestion:
    # The settings down to table-detection shape what is stored: change one and re-ingest everything.
    # batch-size, concurrency and the retries only change the speed.
    chunk-size: 400              # tokens
    min-chunk-size-chars: 150
    min-chunk-length-to-embed: 100   # characters; a shorter chunk is MERGED into the one before, never
                                     # deleted
    max-num-chunks: 10000
    max-embed-tokens: 2048       # the embedding model's input limit; Ollama truncates beyond it, so only
                                 # a single very wide table row can go over
    table-detection: auto        # off | auto | lattice | stream. auto decides per page. Anything but off
                                 # replaces the PDF reader, so prose is read differently too.
    batch-size: 35               # chunks per embedding call. Cost follows tokens, not chunks: ~9.1k per
                                 # batch at today's mean of 261 tokens a chunk. Revisit if chunk-size changes.
    concurrency: 4               # batches written at once; well below the pool's 20 connections
    max-attempts: 3              # only when Ollama's model runner is unreachable; anything else fails at once
    retry-backoff: 2s            # doubled on each retry
