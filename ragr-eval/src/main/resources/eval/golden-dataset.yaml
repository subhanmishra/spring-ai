suite: spring-boot-reference
corpus: spring-boot-reference.pdf
description: >-
  Regression suite for the RAG pipeline, scored against the 645-page Spring Boot reference manual.

  Every expectedPages value below was VERIFIED against the live corpus rather than guessed: each query
  was run through the retrieval probe and the returned chunk text was read to confirm the page really
  does contain the answer. A page that merely scored well was not accepted. Re-verify them after any
  change that alters chunking, because page attribution comes from the chunk's citation header and a
  different chunking produces different page boundaries.

  The suite deliberately mixes three kinds of case, because a dataset of nothing but "find the right
  page" questions would miss most of the ways this pipeline has actually broken:

    - recall cases, which assert a specific page is retrieved;
    - grounding cases, where the corpus cannot answer and the correct behaviour is to answer anyway
      without inventing a citation;
    - capability cases, which guard the system prompt's promise to handle ordinary conversation
      against a change that makes the assistant refuse everything off-corpus.

  Each case carries a category from the same closed task set live turns are classified into
  (CONFIG_LOOKUP, HOW_TO, TROUBLESHOOTING, CONCEPTUAL, GENERAL), so golden and live results break down
  the same way.

  expectedPagesMode says how page recall reads a case with several expected pages: ALL when the answer
  needs every one, ANY when each answers on its own. Like the pages themselves, it is decided by reading
  the chunk text.

  relevantPages lists the further pages whose chunks in the candidate pool state part of the answer -
  found by reading every chunk of the pool of a judged run in full and grading it by hand. They exist to
  calibrate the chunk-grading judge: against expectedPages alone, the judge's correct calls on these
  pages counted as disagreements. Recall, hit rate and MRR ignore them. They are page-level, so a page
  listed here also makes its other chunks "relevant", and they describe one pool: a retrieval change
  that brings a new page into the pool leaves it unlisted until someone reads it.

cases:

  - id: actuator-http-exposure
    query: How are actuator endpoints exposed over HTTP, and what URL prefix do they use?
    description: >-
      Baseline retrieval case. Page 277 states the /actuator prefix and the mapping rule directly, and
      is retrieved at a comfortable margin (0.81 against a 0.60 threshold), so a failure here means
      something has broken in embedding or chunking rather than that the question was marginal.
    expectedFile: spring-boot-reference.pdf
    expectedPages: [277, 278]
    # Verified 6 Oct 2026: p. 277 alone states both the /actuator prefix and the id-to-URL mapping;
    # 278 continues the endpoint table. Either page answers, so recall does not require both.
    expectedPagesMode: ANY
    category: CONCEPTUAL
    # Verified 6 Oct 2026 by reading the pool: p. 299 opens section 5.3, which states the /actuator
    # prefix again; p. 281 shows the management.endpoints.web.exposure.include setting.
    relevantPages: [281, 299]
    mustContain:
      - actuator

  - id: logging-level-property
    query: Which property sets the log level for a specific logger, and what values does it accept?
    description: >-
      Asserts an exact property name reaches the answer. Pages 111 and 112 carry
      logging.level.<logger-name> and the TRACE..OFF value list across a page boundary, which makes
      this the case most sensitive to paragraph coalescing: the answer needs both halves, and they are
      in different chunks because coalescing never spans a page.
    expectedFile: spring-boot-reference.pdf
    expectedPages: [111, 112]
    # Both halves are needed - see the description.
    expectedPagesMode: ALL
    category: CONFIG_LOOKUP
    # Verified 6 Oct 2026 by reading the pool: p. 306 lists TRACE..OFF for the loggers endpoint; p. 582
    # describes the logging.level property's keys and values in the metadata appendix.
    relevantPages: [306, 582]
    mustContain:
      - logging.level

  - id: profiles-activation
    query: How do I activate a specific Spring profile?
    description: >-
      Page 107 names spring.profiles.active explicitly. A dotted property name is a good mustContain
      token precisely because a model cannot paraphrase it - either it came from the context or it did
      not.
    expectedFile: spring-boot-reference.pdf
    expectedPages: [107]
    category: HOW_TO
    # Verified 6 Oct 2026 by reading the pool: p. 372 is the "Set the Active Spring Profiles" how-to;
    # p. 108 shows --spring.profiles.active and setAdditionalProfiles.
    relevantPages: [108, 372]
    mustContain:
      - spring.profiles.active

  - id: starter-parent-purpose
    query: What does the spring-boot-starter-parent POM provide to a project that uses it?
    description: >-
      Page 32 describes the dependency-management section and the Maven defaults. Retrieved at 0.80.
    expectedFile: spring-boot-reference.pdf
    expectedPages: [32]
    category: CONCEPTUAL
    # Verified 6 Oct 2026 by reading the pool: p. 35 says the parent POM gives the project its run goal.
    relevantPages: [35]
    mustContain:
      - spring-boot-starter-parent

  - id: datasource-pool-configuration
    query: How is a DataSource connection pool configured, and what happens if I define my own DataSource bean?
    description: >-
      Page 158 states both halves - the spring.datasource.* properties and the rule that defining your
      own bean disables auto-configuration. A two-part question, which is where a retrieval system that
      returns only the single best-matching chunk starts to show.
    expectedFile: spring-boot-reference.pdf
    expectedPages: [158]
    category: HOW_TO
    # Verified 6 Oct 2026 by reading the pool: p. 159 continues the pool settings; pp. 400, 401, 403 and
    # 404 are the custom-DataSource how-to, which says Boot reuses your bean and auto-configuration backs
    # off. pp. 402 and 405 were read and left out: Hikari's jdbcUrl caveat and a second DataSource.
    relevantPages: [159, 400, 401, 403, 404]
    mustContain:
      - spring.datasource

  - id: executable-jar-maven-plugin
    query: How do I use the Spring Boot Maven plugin to build an executable jar?
    description: >-
      Page 427 carries the actual plugin XML. Included because a code block is chunked differently
      from prose and is a common casualty of a chunking change.
    expectedFile: spring-boot-reference.pdf
    expectedPages: [343, 427]
    # Verified 6 Oct 2026: p. 427 has the plugin XML, p. 343 the fully-executable-jar caveats. Each is a
    # separate route to an answer, not two halves of one, so either counts as full recall.
    expectedPagesMode: ANY
    category: HOW_TO
    # Verified 6 Oct 2026 by reading the pool: p. 36 adds the plugin and runs mvn package - the most
    # direct answer in the pool. pp. 426, 428, 359 and 604 were read and left out: classifiers, a
    # non-executable jar, an overview and the jar format appendix mention the plugin without the steps.
    relevantPages: [36]
    mustContain:
      - spring-boot-maven-plugin

  - id: actuator-port-separation
    query: How do I make the actuator endpoints listen on a different port from the main application?
    description: >-
      Page 419 answers this, and the case is here as a trap. The near-miss question "how do I change
      the server port" retrieves this same page - the manual's own wording is about the ACTUATOR port -
      so a pipeline that conflates the two looks correct on one phrasing and is wrong on the other.
      Asserting the actuator phrasing pins down which of the two the corpus actually supports.
    expectedFile: spring-boot-reference.pdf
    expectedPages: [419]
    category: HOW_TO
    # Verified 6 Oct 2026 by reading the pool: p. 300 is "Customizing the Management Server Port"; p. 294
    # names management.server.port as how the actuator gets a separate port.
    relevantPages: [294, 300]
    mustContain:
      - management.server

  - id: port-in-use-startup-failure
    query: My application fails to start because port 8080 is already in use. How do I fix it?
    description: >-
      A troubleshooting question phrased the way a user hits it - by the symptom, not the feature. Page
      64 shows the exact APPLICATION FAILED TO START report a FailureAnalyzer prints for this, and its
      action: stop the process holding the port or listen on another one. Retrieved first, at 0.70.
    expectedFile: spring-boot-reference.pdf
    expectedPages: [64]
    category: TROUBLESHOOTING
    # Verified 6 Oct 2026 by reading the pool: p. 376 gives server.port=0 for a free port - another way
    # out, ranked 8th and so cut off by top-k. Since chunks break at section headings, p. 375 opens with
    # "9.3.3. Change the HTTP Port" - server.port itself - and ranks 3rd, in context.
    relevantPages: [375, 376]
    # No mustContain: p. 64 names no property, and "server.port" is a substring of the wrong answer.
    # The wrong answer is what is asserted against: on 6 Oct 2026 the model told users to set the
    # actuator's management.server.port to move the application, in every one of four answers.
    # A pattern, not mustNotContain, because a right answer can name the property too, as an aside
    # about the management port - which failed this case once in run 8 after the fixes. So the property
    # fails unless "management port" or "management server port" comes within 120 characters before it.
    # Checked against the 15 answers to this question that named it on 6 Oct 2026: all 12 that offered
    # it as the application's port fail, all 3 labelled asides pass.
    mustNotMatch:
      - '(?<!\bmanagement (?:server )?port\b[\s\S]{0,120})management\.server\.port'

  - id: autoconfig-not-applied
    query: Auto-configuration is not doing what I expect. How can I find out why a particular auto-configuration was or was not applied?
    description: >-
      The harder troubleshooting case, kept for what it shows about retrieval. Page 364 answers it
      directly - the ConditionEvaluationReport, shown with DEBUG logging or by the actuator's conditions
      endpoint - but ranks 6th (0.699), just outside the prompt, behind pages about writing and testing
      auto-configurations that share every keyword. Page 590 gives the short version (--debug, or the
      conditions endpoint) at 4th. A drop here means 590 fell out too; the cut-off of 364 is what the
      "relevant but cut off" panel exists to show.
    expectedFile: spring-boot-reference.pdf
    expectedPages: [364, 590]
    # Verified 6 Oct 2026: each page names both routes to the report on its own, so either counts as
    # full recall.
    expectedPagesMode: ANY
    category: TROUBLESHOOTING
    mustContain:
      - debug

  - id: out-of-corpus-no-fabrication
    query: What were the total quarterly revenue figures for Acme Corporation in 2019?
    description: >-
      Nothing in a Spring Boot manual can answer this. The failure being guarded against is not a wrong
      answer but a CONFIDENT one - the model attaching a plausible page number to an answer it invented.
      expectGrounded false means any citation emitted here is by definition fabricated. Note this case
      is not judged by the LLM judges: with no usable context there is nothing to judge against.
    expectGrounded: false
    category: GENERAL

  - id: general-knowledge-not-refused
    query: In one sentence, what is the difference between a stack and a queue?
    description: >-
      Guards capability 2 of the system prompt, which promises to answer general questions that are not
      in the uploaded documents. This is the case that fails if anyone restores QuestionAnswerAdvisor's
      stock closing line ("Given the context ... and not prior knowledge ... inform the user that you
      can't answer"), which SpringAiConfig.QA_PROMPT_TEMPLATE softens for exactly this reason. A
      refusal here is a regression even though it looks like caution.
    expectGrounded: false
    expectRefusal: false
    category: GENERAL
    mustNotContain:
      - I don't have enough information
