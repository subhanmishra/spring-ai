suite: spring-docs-library
corpus: spring-docs-library (Markdown, Spring Boot 4.1.1 stack, 1,935 pages)
description: >-
  Regression suite for the RAG pipeline, scored against the Markdown documentation library of the Spring
  Boot 4.1.1 stack: Boot, Framework, Cloud, Security, Kafka, Micrometer, Spring AI, Spring Data, release
  notes, Spring Guides and a troubleshooting pack. Every page is uploaded under its library path with
  "/" replaced by "__", and the file names below depend on that.

  Every expectedFiles value below was VERIFIED against the live corpus rather than guessed: each query
  was run through the retrieval probe (top 10, no threshold) and the returned chunk text was read to
  confirm the file really does contain the answer. A file that merely scored well was not accepted.
  Verified 14 Oct 2026 on pipeline version 341bf7945c6b (12,444 chunks). Re-verify them after any change
  that alters chunking or the upload names.

  The cases are file-level: Markdown has no pages, so a chunk is relevant when it comes from an expected
  file. expectedFilesMode says how recall reads a case with several files: ALL when the answer needs
  every one, ANY when each answers on its own - the Spring Data modules, for one, repeat the same
  chapter word for word.

  The suite deliberately mixes three kinds of case, because a dataset of nothing but "find the right
  file" questions would miss most of the ways this pipeline has actually broken:

    - recall cases, which assert a specific file is retrieved;
    - grounding cases, where the corpus cannot answer and the correct behaviour is to answer anyway
      without inventing a citation;
    - capability cases, which guard the system prompt's promise to handle ordinary conversation
      against a change that makes the assistant refuse everything off-corpus.

  Each case carries a category from the same closed task set live turns are classified into
  (CONFIG_LOOKUP, HOW_TO, TROUBLESHOOTING, CONCEPTUAL, GENERAL), so golden and live results break down
  the same way. mustContain tokens are exact - a property, a class, an annotation - each checked to
  appear in an expected file.

cases:

  # --- Spring Boot ---------------------------------------------------------------------------------

  - id: actuator-http-exposure
    query: How are actuator endpoints exposed over HTTP, and what URL prefix do they use?
    description: >-
      Baseline retrieval case: the endpoints page states the /actuator prefix and the exposure
      properties, and holds 7 of the top 10 (top 0.810). A failure here means embedding or chunking
      broke rather than that the question was marginal.
    expectedFiles: [01-spring-boot__087-reference-actuator-endpoints.md]
    category: CONCEPTUAL
    relevantFiles: [01-spring-boot__088-reference-actuator-monitoring.md]
    mustContain:
      - /actuator

  - id: actuator-port-separation
    query: How do I make the actuator endpoints listen on a different port from the main application?
    description: >-
      The how-to (rank 1, 0.792) and the monitoring page both give management.server.port. The pair to
      port-in-use-startup-failure below: the property that is right here is the wrong answer there.
    expectedFiles:
      - 01-spring-boot__111-how-to-actuator.md
      - 01-spring-boot__088-reference-actuator-monitoring.md
    expectedFilesMode: ANY
    category: HOW_TO
    mustContain:
      - management.server.port

  - id: port-in-use-startup-failure
    query: My application fails to start because port 8080 is already in use. How do I fix it?
    description: >-
      A troubleshooting question phrased by the symptom. The failure-analyzer page shows the exact
      APPLICATION FAILED TO START report and its action (rank 1, 0.816); the web server how-to gives
      server.port. Carried over from the PDF suite for its trap: in Oct 2026 the model told users to set
      the actuator's management.server.port to move the application.
    expectedFiles:
      - 29-troubleshooting__01-startup-failure-reports__017-port-in-use.md
      - 01-spring-boot__101-how-to-webserver.md
    expectedFilesMode: ANY
    category: TROUBLESHOOTING
    # The property fails unless "management port" or "management server port" comes within 120
    # characters before it, which lets a correctly labelled aside through.
    mustNotMatch:
      - '(?<!\bmanagement (?:server )?port\b[\s\S]{0,120})management\.server\.port'

  - id: logging-level-property
    query: Which property sets the log level for a specific logger, and what values does it accept?
    description: >-
      An exact property name reaches the answer. The logging page ranks 1st (0.735) beside the
      loggers endpoint and the logging playbook entry, which both mention levels too.
    expectedFiles: [01-spring-boot__024-reference-features-logging.md]
    category: CONFIG_LOOKUP
    relevantFiles: [01-spring-boot__091-reference-actuator-loggers.md, 29-troubleshooting__03-playbook__009-logging-config.md]
    mustContain:
      - logging.level

  - id: devtools-restart-exclude
    query: How do I stop DevTools from restarting the application when files under a particular folder change?
    description: >-
      A YAML/properties answer (spring.devtools.restart.exclude or additional-exclude). The devtools
      page fills all ten slots, so this guards that its config examples survived parsing.
    expectedFiles: [01-spring-boot__018-reference-using-devtools.md]
    category: CONFIG_LOOKUP
    mustContain:
      - spring.devtools.restart

  - id: custom-task-executor
    query: How do I register my own AsyncTaskExecutor so that Spring MVC and @EnableAsync both use it?
    description: >-
      A code answer: a bean named applicationTaskExecutor (rank 1, 0.757). The page's Java examples had
      Kotlin twins, which ingestion drops; a Kotlin "fun applicationTaskExecutor" in the answer means
      the twin came back.
    expectedFiles: [01-spring-boot__028-reference-features-task-execution-and-scheduling.md]
    category: HOW_TO
    mustContain:
      - applicationTaskExecutor
    mustNotMatch:
      - '\bfun\s+applicationTaskExecutor\b'

  # --- Spring Framework ----------------------------------------------------------------------------

  - id: bean-scopes
    query: What bean scopes does the Spring Framework support, and which ones need a web-aware ApplicationContext?
    description: >-
      The scopes page opens with a table of the six scopes (rank 1, 0.849, and 7 of the top 10).
    expectedFiles: [04-spring-framework__014-core-beans-factory-scopes.md]
    category: CONCEPTUAL
    mustContain:
      - prototype

  - id: aop-advice-ordering
    query: When two aspects have advice on the same join point, how is the order they run in decided?
    description: >-
      The @AspectJ advice page's "Advice Ordering" section: Ordered or @Order on the aspect. The schema
      AOP page (rank 2) says the same for XML aspects.
    expectedFiles: [04-spring-framework__081-core-aop-ataspectj-advice.md]
    category: CONCEPTUAL
    relevantFiles: [04-spring-framework__085-core-aop-schema.md]
    mustContain:
      - Order

  - id: mvc-handler-arguments
    query: Which method arguments can a Spring MVC @RequestMapping handler method declare?
    description: >-
      The method-arguments page is one large table - one of the 101 tables the first Markdown conversion
      lost as a "[TABLE]" placeholder, so this case guards that gap. Rank 2 (0.817), behind the handler
      methods overview.
    expectedFiles: [04-spring-framework__173-web-webmvc-mvc-controller-ann-methods-arguments.md]
    category: CONFIG_LOOKUP
    relevantFiles: [04-spring-framework__172-web-webmvc-mvc-controller-ann-methods.md]
    mustContain:
      - '@RequestParam'

  # --- Security, Cloud, Data, Kafka, Spring AI -----------------------------------------------------

  - id: security-csrf-disable
    query: How do I disable CSRF protection in Spring Security for a servlet application, and when is that safe?
    description: >-
      The servlet CSRF page holds 6 of the top 10 (0.834); the reactive page ranks 5th - the right
      product but the wrong stack, which the section line names.
    expectedFiles: [19-spring-security__105-servlet-exploits-csrf.md]
    category: HOW_TO
    relevantFiles: [19-spring-security__018-features-exploits-csrf.md]
    mustContain:
      - csrf

  - id: gateway-path-predicate
    query: How do I route requests to a backend by URL path in Spring Cloud Gateway?
    description: >-
      Gateway documents the Path predicate twice, for the WebMvc and the WebFlux server. The WebMvc
      predicates page ranks 3rd (0.752); the WebFlux one is not in the top 10. Either answers.
    expectedFiles:
      - 11-spring-cloud-gateway__071-spring-cloud-gateway-server-webmvc-gateway-request-predicates.md
      - 11-spring-cloud-gateway__007-spring-cloud-gateway-server-webflux-request-predicates-factories.md
    expectedFilesMode: ANY
    category: HOW_TO

  - id: config-server-git
    query: How do I point Spring Cloud Config Server at a Git repository for its configuration?
    description: >-
      spring.cloud.config.server.git.uri appears in four places: the server overview (rank 2), the Git
      backend page (rank 4), the quickstart and the centralized-configuration guide (rank 1). Any of them
      answers.
    expectedFiles:
      - 08-spring-cloud-config__002-server.md
      - 08-spring-cloud-config__004-server-environment-repository-git-backend.md
      - 08-spring-cloud-config__043-quickstart.md
      - 28-spring-guides__050-gs-centralized-configuration.md
    expectedFilesMode: ANY
    category: CONFIG_LOOKUP
    mustContain:
      - spring.cloud.config.server.git.uri

  - id: derived-query-keywords
    query: Which keywords can I use in Spring Data derived query method names, such as findByLastnameAndFirstname?
    description: >-
      Every Spring Data module repeats the keyword table, in its query-methods page and its keyword
      reference - the case the section line's product name exists for. Any module's copy answers. The
      relational module's pages hold the top 7.
    expectedFiles:
      - 24-spring-data-jpa__010-jpa-query-methods.md
      - 24-spring-data-jpa__026-repositories-query-keywords-reference.md
      - 25-spring-data-relational__028-jdbc-query-methods.md
      - 25-spring-data-relational__042-r2dbc-query-methods.md
      - 25-spring-data-relational__018-repositories-query-keywords-reference.md
      - 26-spring-data-redis__040-repositories-query-keywords-reference.md
      - 27-spring-data-mongodb__044-mongodb-repositories-query-methods.md
      - 27-spring-data-mongodb__052-repositories-query-keywords-reference.md
    expectedFilesMode: ANY
    category: CONFIG_LOOKUP

  - id: jpa-entity-graph
    query: How do I use @EntityGraph on a Spring Data JPA repository query method to load an association eagerly?
    description: >-
      A module-specific question. Rank 1 (0.769) as phrased; asked without the annotation's name the
      same page fell to 9th, behind the JPA guide - noted for whoever rephrases it.
    expectedFiles: [24-spring-data-jpa__010-jpa-query-methods.md]
    category: HOW_TO
    mustContain:
      - '@EntityGraph'

  - id: kafka-listener-errors
    query: How do I handle exceptions thrown by a @KafkaListener and send failed records to a dead-letter topic?
    description: >-
      The annotation error-handling page holds 9 of the top 10 (0.844), with DefaultErrorHandler and
      DeadLetterPublishingRecoverer in code.
    expectedFiles: [20-spring-kafka__047-kafka-annotation-error-handling.md]
    category: HOW_TO
    mustContain:
      - DeadLetterPublishingRecoverer

  - id: spring-ai-chat-memory
    query: How do I give a Spring AI ChatClient memory of the earlier messages in a conversation?
    description: >-
      The chat memory page holds 9 of the top 10 (0.811). This application itself uses the answer,
      MessageChatMemoryAdvisor.
    expectedFiles: [23-spring-ai__059-api-chat-memory.md]
    category: HOW_TO
    mustContain:
      - MessageChatMemoryAdvisor

  # --- Release notes and guides: content the PDFs did not have --------------------------------------

  - id: boot4-starter-renames
    query: When migrating to Spring Boot 4.0, which starter replaces spring-boot-starter-web?
    description: >-
      The migration guide's starter table maps spring-boot-starter-web to spring-boot-starter-webmvc.
      The guide fills all ten slots (0.841).
    expectedFiles: [00-release-notes-and-migration__001-spring-boot-4-0-migration-guide.md]
    category: CONFIG_LOOKUP
    mustContain:
      - spring-boot-starter-webmvc

  - id: guide-rest-service
    query: Walk me through building a simple RESTful web service with Spring Boot that returns a JSON greeting.
    description: >-
      The REST service guide (rank 1, 0.836) beside its CORS and reactive variants, which share most of
      the text. Guides carry the Boot version they target in their section line.
    expectedFiles: [28-spring-guides__002-gs-rest-service.md]
    category: HOW_TO
    relevantFiles: [28-spring-guides__008-gs-rest-service-cors.md]
    mustContain:
      - '@RestController'

  # --- Troubleshooting pack ------------------------------------------------------------------------

  - id: startup-no-such-bean
    query: >-
      My app fails with APPLICATION FAILED TO START: Parameter 0 of constructor in com.example.OrderService
      required a bean of type 'com.example.PaymentClient' that could not be found. What does it mean and
      how do I fix it?
    description: >-
      A pasted startup report. The no-such-bean failure-analyzer page ranks 3rd (0.737) among other
      failure reports that share its wording - the closest call in the suite, so a drop here is the
      first sign of a retrieval regression.
    expectedFiles: [29-troubleshooting__01-startup-failure-reports__001-no-such-bean.md]
    category: TROUBLESHOOTING

  - id: lazy-initialization-exception
    query: >-
      I get LazyInitializationException: could not initialize proxy - no Session when I read an entity's
      collection outside the repository. How do I fix it?
    description: >-
      A runtime problem by its exception. The playbook entry holds the top 4 (0.850).
    expectedFiles: [29-troubleshooting__03-playbook__025-lazy-initialization.md]
    category: TROUBLESHOOTING

  - id: moved-health-indicator
    query: >-
      After upgrading to Spring Boot 4, my import of org.springframework.boot.actuate.health.HealthIndicator
      no longer compiles. Where does HealthIndicator live now?
    description: >-
      An exact-identifier lookup, guarding keyword search. The upgrade map that lists the move (013) is
      the only chunk containing the fully qualified name, so keyword search puts it in the prompt even
      when the approximate vector index misses it - as the index built during ingestion did (exact
      search ranks it 3rd-5th, 0.765-0.747). The actuator endpoints page ranks 1st (0.793).
    expectedFiles:
      - 29-troubleshooting__02-upgrade-breakages__013-boot-classes-actuate-health.md
      - 01-spring-boot__087-reference-actuator-endpoints.md
    expectedFilesMode: ANY
    category: TROUBLESHOOTING
    mustContain:
      - org.springframework.boot.health.contributor

  - id: renamed-logging-property
    query: After upgrading to Spring Boot 4.1, my logging.file.max-history setting has no effect. What property replaces it?
    description: >-
      The second exact-identifier lookup, and the one that works on embeddings alone: the 4.1
      configuration changelog ranks 1st (0.777) and the property-changes map 2nd (0.769), both naming
      logging.logback.rollingpolicy.max-history.
    expectedFiles:
      - 29-troubleshooting__02-upgrade-breakages__093-property-changes.md
      - 00-release-notes-and-migration__007-spring-boot-4-1-configuration-changelog.md
    expectedFilesMode: ANY
    category: TROUBLESHOOTING
    mustContain:
      - logging.logback.rollingpolicy.max-history

  # --- Grounding and capability ----------------------------------------------------------------------

  - id: out-of-corpus-no-fabrication
    query: What were the total quarterly revenue figures for Acme Corporation in 2019?
    description: >-
      Nothing in the library can answer this; its best chunk scores 0.552, well under the 0.65
      threshold. The failure being guarded against is a CONFIDENT answer - the model attaching a
      plausible citation to something it invented.
    expectGrounded: false
    category: GENERAL

  - id: general-knowledge-not-refused
    query: In one sentence, what is the difference between a stack and a queue?
    description: >-
      Guards capability 2 of the system prompt, which promises to answer general questions that are not
      in the uploaded documents. This is the case that fails if anyone restores QuestionAnswerAdvisor's
      stock closing line, which SpringAiConfig.QA_PROMPT_TEMPLATE softens for exactly this reason. Note:
      on this corpus its best chunk (RabbitMQ consumer properties) scores 0.658, just over the
      threshold, so one or two unrelated chunks reach the prompt.
    expectGrounded: false
    expectRefusal: false
    category: GENERAL
    mustNotContain:
      - I don't have enough information
