spring:
  application:
    name: ragr-eval
  datasource:
    # currentSchema=eval, so unqualified table names resolve to the eval schema. The same database as
    # the other applications - a schema, not a database, so Grafana and pgAdmin need one connection.
    url: jdbc:postgresql://localhost:5432/ragdatabase?currentSchema=eval
    username: myuser
    password: secret
    hikari:
      pool-name: ragr-eval-hikari-pool
      # One judge worker, one listener and the gauge refreshes - nothing needs more.
      maximum-pool-size: 3
      minimum-idle: 1
  flyway:
    # This application owns the eval schema and keeps its migration history inside it, apart from
    # ragr-ingest's history in public.
    schemas: eval
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ragr-eval
      # A NEW group starts at the newest turn: judging three days of backlog on first start would tie up
      # the model chat needs. To replay on purpose, reset this group's offsets.
      auto-offset-reset: latest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Wrapped, so an unreadable record is reported once and skipped, not re-read forever.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        # The publisher sends no type headers, so the target type is set here.
        spring.json.value.default.type: com.example.subhanmishra.event.ChatTurnCompleted
        spring.json.use.type.headers: false
    listener:
      # Joins each turn's evaluation to the chat trace that produced it, via the traceparent header.
      observation-enabled: true
  ai:
    model:
      # The judges are chat calls; nothing here embeds.
      embedding: none

server:
  # The actuator (Prometheus scrapes it) and the human review endpoint share this port.
  port: 9096

management:
  endpoints:
    web:
      exposure:
        include: "health,metrics,prometheus"
  observations:
    key-values:
      application: ${spring.application.name}
  # The Spring Boot 4 key. The old management.otlp.tracing.endpoint is accepted silently but ignored,
  # and with it no traces reached Tempo at all.
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: "http://localhost:4318/v1/traces"
  tracing:
    sampling:
      probability: 1.0
  prometheus:
    metrics:
      export:
        enabled: true
        step: 5s
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
      env: local

loki:
  url: http://localhost:3100/loki/api/v1/push

app:
  eval:
    # Where ragr-app publishes turns; read by the live consumer and by the golden suite.
    topic: rag.chat.turn.completed
    # Where ragr-app publishes ratings.
    feedback-topic: rag.chat.feedback
    enabled: true
    # The SAME model as chat - a memory decision, not a quality one. With the chat and embedding models
    # loaded the machine has ~1 GB left; the smallest dedicated judge needs 4.39 GiB.
    # The price is self-judging bias: the rates are optimistic. Read them as a TREND (the bias is roughly
    # constant, so a drop after a change is real), never as a score to quote.
    judge-model: gemma4:e2b
    # Spring AI sends no temperature unless set, and the model's default is 1.0, at which the same
    # answer gets different verdicts run to run.
    judge-temperature: 0.0
    # A verdict is one word or digit; the cap stops a judge that starts explaining from holding the one
    # model runner for minutes. The list-writing judges use judge.claims-num-predict.
    judge-num-predict: 8
    # Must hold the passages and the answer. Ollama cuts an over-long prompt from the START, silently
    # dropping the context being judged.
    judge-num-ctx: 8192
    online:
      enabled: true
      # Which turns are QUEUED for the judges. The rule-based metrics run on every turn regardless. It no
      # longer protects chat latency - the idle gate does that - only how far behind the queue falls, at
      # about a minute of judge time per grounded turn.
      judge-sample-rate: 1.0
      # Random share put in the human review queue, beside every thumbs-down and every user-judge
      # disagreement, so the reviewed set is not only failures.
      review-sample-rate: 0.05
      # A follow-up within this window whose pool overlaps the previous turn's by at least
      # rephrase-overlap (Jaccard over chunk ids) is the same question asked again.
      rephrase-window: 5m
      rephrase-overlap: 0.6
    judge:
      # Off in the golden suite's test JVM (EvalSuiteIT sets it), which must not take live turns.
      worker-enabled: true
      poll-interval: 2s
      # A queued turn not reached by then is SKIPPED and counted, so the queue never runs hours behind.
      max-backlog-age: 6h
      # Per judge call; the slowest seen was 22 s. This catches a stuck Ollama, not a slow one.
      call-timeout-seconds: 120
      # How long shutdown lets the call in flight finish before interrupting it (the turn goes back to
      # PENDING). Must fit inside the container's 40 s stop_grace_period.
      shutdown-wait-seconds: 20
      # Share of an answer's claims that must be supported for end-to-end success.
      faithfulness-threshold: 0.8
      # Most claims taken from one answer, and the output cap for the two list-writing judges.
      max-claims: 8
      claims-num-predict: 400
      idle-gate:
        # Off only if spring.ai.ollama.base-url points the judges at a model chat does not use.
        enabled: true
        # ragr-app's MANAGEMENT port; containers override it with APP_EVAL_JUDGE_IDLE_GATE_CHAT_ACTUATOR_URL.
        chat-actuator-url: http://localhost:9095
        poll-interval: 500ms
        # A stuck gauge must not stop judging forever; past this the call goes ahead and is counted.
        max-wait: 10m
    retention:
      # Live turns, their pools and feedback older than this are deleted daily. Golden turns are kept.
      live-days: 14
    golden:
      dataset-location: classpath:eval/golden-dataset.yaml
      # Judging takes several times longer, so it is off by default. For one run:
      # -Dapp.eval.golden.judged=true
      judged: false
      persist: true
      # The running ragr-app the suite drives, through its real endpoint.
      chat-url: http://localhost:8080
      # How long a case waits for its turn on Kafka after the answer returns. It arrives within
      # milliseconds; running out means it was dropped.
      turn-timeout: 30s
