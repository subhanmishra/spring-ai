spring:
  application:
    name: ragr-eval
  datasource:
    # currentSchema=eval puts the eval schema on the search path, so the entities' unqualified table
    # names resolve there. Same database and credentials as ragr-app; a separate schema, not a
    # separate database, because Grafana's per-case tables and pgAdmin already point at this one.
    url: jdbc:postgresql://localhost:5432/ragdatabase?currentSchema=eval
    username: myuser
    password: secret
    hikari:
      pool-name: ragr-eval-hikari-pool
      # One write per golden case and one read per gauge refresh - nothing here needs more.
      maximum-pool-size: 3
      minimum-idle: 1
  flyway:
    # This application owns the eval schema and keeps its own migration history inside it, so its
    # version numbers can never collide with ragr-app's history in public. V1 moves the tables
    # ragr-app used to own into this schema, keeping every recorded run.
    schemas: eval
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ragr-eval
      # A NEW group starts at the newest turn, not the oldest retained one. The topic keeps three days,
      # and judging all of it on first start would occupy the Ollama runner that live chat needs.
      # Replaying past traffic is deliberate: reset this group's offsets with kafka-consumer-groups.
      auto-offset-reset: latest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Wrapped, so a record that cannot be read is handed to the error handler once and skipped,
      # instead of failing in the poll loop and being re-read forever.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        # The publisher sends no type headers, so the target type is set here.
        spring.json.value.default.type: com.example.subhanmishra.event.ChatTurnCompleted
        spring.json.use.type.headers: false
    listener:
      # Joins each turn's evaluation to the chat trace that produced it, via the traceparent header.
      observation-enabled: true
  ai:
    model:
      # The judges are chat calls. Nothing here embeds, so no embedding model is created.
      embedding: none

server:
  # Actuator only; there is no API. Prometheus scrapes this port.
  port: 9096

management:
  endpoints:
    web:
      exposure:
        include: "health,metrics,prometheus"
  observations:
    key-values:
      application: ${spring.application.name}
  # The Boot 4 key. Its predecessor, management.otlp.tracing.endpoint, is still accepted without a
  # warning but ignored, and under it this application exported no traces at all - the consumer and
  # the judge calls were missing from Tempo. ragr-app hid the problem by getting the collector's
  # address from its Docker Compose service connection instead, which this application does not use.
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: "http://localhost:4318/v1/traces"
  tracing:
    sampling:
      probability: 1.0
  prometheus:
    metrics:
      export:
        enabled: true
        step: 5s
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
      env: local

loki:
  url: http://localhost:3100/loki/api/v1/push

app:
  eval:
    # Where ragr-app publishes completed turns. Read by the online consumer and by the golden suite.
    topic: rag.chat.turn.completed
    # Where ragr-app publishes users' ratings of answers.
    feedback-topic: rag.chat.feedback
    enabled: true
    # The SAME model the chat path uses, and that is a memory decision rather than a quality one.
    # Measured on this host: gemma4:e2b's llama-server commits ~8.1 GB (Ollama's scheduler predicts
    # 6.9 GiB; /api/ps reports only the 1.70 GB placed on the iGPU) and nomic-embed-text ~0.5 GB,
    # leaving ~1.1 GB of RAM available of 15.63 GB and ~2.7 GB of commit headroom. Loading gemma cold
    # already evicts the embedder once. The smallest purpose-built grounded-factuality judge,
    # bespoke-minicheck, ships only at 7B with a 4.39 GiB weights layer - there is no room for it
    # alongside the pair, so every judgement would evict a model or page to disk. Reusing the chat
    # model loads nothing new.
    #
    # The price is self-judging bias: a model grading its own output is more generous than an
    # independent one, so these rates are optimistic in absolute terms. Read them as a TREND - the bias
    # is a roughly constant offset, so a drop after a prompt or model change is real - and never quote
    # the absolute number as a quality score.
    judge-model: gemma4:e2b
    # Pinned for the same reason the chat path pins it: Spring AI sends NO temperature unless one is
    # set here, and Gemma's Modelfile defaults to 1.0. A judge sampling at 1.0 returns different
    # verdicts for the same answer on consecutive runs, turning a regression signal into noise.
    judge-temperature: 0.0
    # A verdict judge's whole answer is one word or digit. Without a cap, a judge that starts
    # explaining itself holds Ollama's single runner slot for minutes. The claim judges, which write
    # lists, use judge.claims-num-predict instead.
    judge-num-predict: 8
    # Must hold the retrieved context plus the answer being judged. Ollama truncates an over-long
    # prompt FROM THE LEFT, which would silently drop the context the judgement is about and produce a
    # confident wrong verdict rather than an error.
    judge-num-ctx: 8192
    online:
      enabled: true
      # Deterministic metrics (citations, zero-hit, score spread, refusals) run on 100% of turns
      # regardless of this - they are regex over data already in the event and cost microseconds. This
      # rate decides which turns are QUEUED for the judges; it no longer has to protect chat latency,
      # because the judge worker only calls the model while chat is idle (judge.idle-gate below). What it
      # still trades is how far behind the queue falls: ~90-100 s of judge time per grounded turn
      # (measured 6 Oct 2026) against max-backlog-age.
      judge-sample-rate: 1.0
      # A random share of live turns drawn into the human review queue, beside every thumbs-down and every
      # turn where the user and the judge disagree - so the reviewed set is not only failures.
      review-sample-rate: 0.05
      # A follow-up in the same conversation within this window whose candidate pool overlaps the
      # previous turn's by at least rephrase-overlap (Jaccard over chunk ids) is the user asking again.
      rephrase-window: 5m
      rephrase-overlap: 0.6
    judge:
      # Off in the golden suite's test JVM (EvalSuiteIT sets it), which judges its own turns inline and
      # must not take live ones from the queue.
      worker-enabled: true
      poll-interval: 2s
      # A queued turn not reached within this is SKIPPED and counted
      # (rag_eval_online_judge_skipped_total), so the backlog never describes traffic from hours ago.
      max-backlog-age: 6h
      # Per judge call. The longest measured was 22 s (relevancy on a 5-chunk context); this bounds a
      # wedged Ollama, not a slow one.
      call-timeout-seconds: 120
      # How long shutdown lets the turn in flight finish before interrupting it - the turn goes back to
      # PENDING. Must leave the whole shutdown inside ragr-eval's stop_grace_period in compose.yaml (40s).
      shutdown-wait-seconds: 20
      # The share of an answer's claims that must be supported for the end-to-end verdict to pass.
      faithfulness-threshold: 0.8
      # Claims taken from one answer, and the generation cap for the two judges that write claim lists.
      max-claims: 8
      claims-num-predict: 400
      idle-gate:
        # Off only if spring.ai.ollama.base-url points the judges at a model chat does not use.
        enabled: true
        # ragr-app's MANAGEMENT port. Containers override this with APP_EVAL_JUDGE_IDLE_GATE_CHAT_ACTUATOR_URL.
        chat-actuator-url: http://localhost:9095
        poll-interval: 500ms
        # A stuck gauge must not stop judging forever; past this the call goes ahead and is counted.
        max-wait: 10m
    retention:
      # Live turns, their pools and feedback older than this are deleted daily. Golden turns are kept.
      live-days: 14
    golden:
      dataset-location: classpath:eval/golden-dataset.yaml
      # Judging roughly triples a run's wall clock. Off by default so the tagged test stays a quick
      # retrieval-and-citation regression check. EvalSuiteIT reads it, so a judged run is
      # -Dapp.eval.golden.judged=true on the command line.
      judged: false
      persist: true
      # The running ragr-app the golden suite drives. The suite goes through its real HTTP endpoint -
      # same advisors, prompt, model and retrieval as a user gets - and reads each turn back from Kafka.
      chat-url: http://localhost:8080
      # How long a golden case waits for its turn's event after the answer has come back. The publisher
      # sends within milliseconds, so running out means the event was dropped - the broker was down.
      turn-timeout: 30s
