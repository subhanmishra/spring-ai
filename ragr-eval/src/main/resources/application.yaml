spring:
  application:
    name: ragr-eval
  datasource:
    # currentSchema=eval puts the eval schema on the search path, so the entities' unqualified table
    # names resolve there. Same database and credentials as ragr-app; a separate schema, not a
    # separate database, because Grafana's per-case tables and pgAdmin already point at this one.
    url: jdbc:postgresql://localhost:5432/ragdatabase?currentSchema=eval
    username: myuser
    password: secret
    hikari:
      pool-name: ragr-eval-hikari-pool
      # One write per golden case and one read per gauge refresh - nothing here needs more.
      maximum-pool-size: 3
      minimum-idle: 1
  flyway:
    # This application owns the eval schema and keeps its own migration history inside it, so its
    # version numbers can never collide with ragr-app's history in public. V1 moves the tables
    # ragr-app used to own into this schema, keeping every recorded run.
    schemas: eval
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ragr-eval
      # A NEW group starts at the newest turn, not the oldest retained one. The topic keeps three days,
      # and judging all of it on first start would occupy the Ollama runner that live chat needs.
      # Replaying past traffic is deliberate: reset this group's offsets with kafka-consumer-groups.
      auto-offset-reset: latest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Wrapped, so a record that cannot be read is handed to the error handler once and skipped,
      # instead of failing in the poll loop and being re-read forever.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        # The publisher sends no type headers, so the target type is set here.
        spring.json.value.default.type: com.example.subhanmishra.event.ChatTurnCompleted
        spring.json.use.type.headers: false
    listener:
      # Joins each turn's evaluation to the chat trace that produced it, via the traceparent header.
      observation-enabled: true
  ai:
    model:
      # The judges are chat calls. Nothing here embeds, so no embedding model is created.
      embedding: none

server:
  # Actuator only; there is no API. Prometheus scrapes this port.
  port: 9096

management:
  endpoints:
    web:
      exposure:
        include: "health,metrics,prometheus"
  observations:
    key-values:
      application: ${spring.application.name}
  otlp:
    tracing:
      endpoint: "http://localhost:4318/v1/traces"
  tracing:
    sampling:
      probability: 1.0
  prometheus:
    metrics:
      export:
        enabled: true
        step: 5s
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
      env: local

loki:
  url: http://localhost:3100/loki/api/v1/push

app:
  eval:
    # Where ragr-app publishes completed turns. Read by the online consumer and by the golden suite.
    topic: rag.chat.turn.completed
    enabled: true
    # The SAME model the chat path uses, and that is a memory decision rather than a quality one.
    # Measured on this host: gemma4:e2b's llama-server commits ~8.1 GB (Ollama's scheduler predicts
    # 6.9 GiB; /api/ps reports only the 1.70 GB placed on the iGPU) and nomic-embed-text ~0.5 GB,
    # leaving ~1.1 GB of RAM available of 15.63 GB and ~2.7 GB of commit headroom. Loading gemma cold
    # already evicts the embedder once. The smallest purpose-built grounded-factuality judge,
    # bespoke-minicheck, ships only at 7B with a 4.39 GiB weights layer - there is no room for it
    # alongside the pair, so every judgement would evict a model or page to disk. Reusing the chat
    # model loads nothing new.
    #
    # The price is self-judging bias: a model grading its own output is more generous than an
    # independent one, so these rates are optimistic in absolute terms. Read them as a TREND - the bias
    # is a roughly constant offset, so a drop after a prompt or model change is real - and never quote
    # the absolute number as a quality score.
    judge-model: gemma4:e2b
    # Pinned for the same reason the chat path pins it: Spring AI sends NO temperature unless one is
    # set here, and Gemma's Modelfile defaults to 1.0. A judge sampling at 1.0 returns different
    # verdicts for the same answer on consecutive runs, turning a regression signal into noise.
    judge-temperature: 0.0
    # A judge's whole answer is one word. Without a cap, a judge that starts explaining itself holds
    # Ollama's single runner slot for minutes - and on the online path that delays a real user.
    judge-num-predict: 8
    # Must hold the retrieved context plus the answer being judged. Ollama truncates an over-long
    # prompt FROM THE LEFT, which would silently drop the context the judgement is about and produce a
    # confident wrong verdict rather than an error.
    judge-num-ctx: 8192
    online:
      enabled: true
      # Deterministic metrics (citations, zero-hit, score spread, refusals) run on 100% of turns
      # regardless of this - they are regex over data already in the response and cost microseconds.
      # This rate governs only the LLM judges. Judging never blocks the caller that triggered it, but
      # it is NOT free to the system: Ollama serialises on one runner slot, so a judge call occupies
      # the chat model and the NEXT user's generation queues behind it. Set 0.0 to keep the free
      # metrics and switch the model calls off entirely.
      judge-sample-rate: 0.1
      # One in flight at a time, so the worst case is a single queued generation rather than a pile-up.
      # Admission is non-blocking - over this bound a judgement is DROPPED and counted, never queued.
      # A rising rag_eval_online_judgements_dropped_total means the sample rate is too high for the
      # traffic, not that anything is broken.
      max-concurrent-judgements: 1
      judge-timeout-seconds: 120
    golden:
      dataset-location: classpath:eval/golden-dataset.yaml
      # Judging roughly triples a run's wall clock. Off by default so the tagged test stays a quick
      # retrieval-and-citation regression check; the test can switch it on explicitly.
      judged: false
      persist: true
      # The running ragr-app the golden suite drives. The suite goes through its real HTTP endpoint -
      # same advisors, prompt, model and retrieval as a user gets - and reads each turn back from Kafka.
      chat-url: http://localhost:8080
      # How long a golden case waits for its turn's event after the answer has come back. The publisher
      # sends within milliseconds, so running out means the event was dropped - the broker was down.
      turn-timeout: 30s
