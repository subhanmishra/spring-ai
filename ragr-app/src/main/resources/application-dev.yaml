management:
  endpoints:
    web:
      exposure:
        include: "health,metrics,prometheus"
  observations:
    key-values:
      application: ${spring.application.name}
  server:
    port: 9095
  # The Spring Boot 4 key; the old management.otlp.tracing.endpoint is silently ignored. Set explicitly
  # so tracing does not depend on Docker Compose support supplying the address.
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: "http://localhost:4318/v1/traces"
  tracing:
    sampling:
      probability: 1.0
  # Prometheus scrapes the metrics. The OpenTelemetry starter would also push them over OTLP, which
  # nothing here receives.
  otlp:
    metrics:
      export:
        enabled: false
  prometheus:
    metrics:
      export:
        enabled: true
        step: 5s
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
      env: local
    distribution:
      # Histograms only for the timers the dashboard takes percentiles from; buckets for every timer
      # would dominate each scrape. Everything else still exports _count, _sum and _max, which is all
      # rates and averages need.
      #
      # The keys match by PREFIX, so `spring.ai.advisor` also turns on `spring.ai.advisor.active`.
      # Each `.active` twin is switched off explicitly - removing a `false` line turns it back on.
      percentiles-histogram:
        "[http.server.requests]": true
        "[gen_ai.client.operation]": true
        "[spring.ai.advisor]": true
        "[db.vector.client.operation]": true
        "[spring.ai.chat.client]": true    # the whole turn, as the user waits for it
        "[http.server.requests.active]": false
        "[gen_ai.client.operation.active]": false
        "[spring.ai.advisor.active]": false
        "[db.vector.client.operation.active]": false
        "[spring.ai.chat.client.active]": false
      # Where the buckets stop. The default, 30s, is shorter than a slow chat turn, which would read as
      # 30s. 300s is above the slowest answer num-predict allows.
      maximum-expected-value:
        "[http.server.requests]": 300s
        "[gen_ai.client.operation]": 300s
        "[spring.ai.chat.client]": 300s
        "[spring.ai.advisor]": 300s
        "[db.vector.client.operation]": 300s
    enable:
      all: true

loki:
  url: http://localhost:3100/loki/api/v1/push

spring:
  application:
    name: spring-ai-ragr
  docker:
    compose:
      lifecycle-management: START_AND_STOP
      # No `file:` on purpose. compose.yaml sits at the repository root and is found in the working
      # directory, which is the root both from IntelliJ and from ./mvnw (see ragr-app/pom.xml).
  # Spring Boot cannot discover Kafka through Docker Compose as it does Postgres and Redis, so the
  # address is set here. It matches the advertised listener in compose.yaml.
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      # The payload is mostly retrieved chunk text, which compresses well.
      compression-type: zstd
      properties:
        # How long a send may wait for broker metadata. The default, 60s, would hold a thread for a
        # minute while Kafka is down. Sends are already off the chat thread; this bounds each one.
        max.block.ms: 500
        # Longest wait between reconnect attempts to a broker that is down; at the default, 1s, the
        # disconnect warning floods the logs. The cost: up to 10s after the broker returns before sends
        # resume, and turns in that gap are dropped and counted.
        reconnect.backoff.max.ms: 10000
        # Plain JSON, with no header naming this application's class: the consumer has its own type.
        spring.json.add.type.headers: false
    template:
      # Propagates the chat turn's trace into the record headers.
      observation-enabled: true
    admin:
      # How long startup waits to create the topics before carrying on; the default 30s would slow
      # every start with Kafka down.
      operation-timeout: 5s
  datasource:
    url: jdbc:postgresql://localhost:5432/ragdatabase
    username: myuser
    password: secret
    hikari:
      pool-name: rag-hikari-pool
      # Chat only reads: one similarity search per turn.
      maximum-pool-size: 5
      minimum-idle: 2                # below maximum-pool-size, or idle connections are never closed
      connection-timeout: 30000      # 30s - fail rather than wait forever for a connection
      idle-timeout: 300000           # 5m
      keepalive-time: 120000         # 2m - keeps idle connections from being dropped by the network
      max-lifetime: 1800000          # 30m - below any lifetime the database or a proxy enforces
      validation-timeout: 5000
      leak-detection-threshold: 60000
  ai:
    retry:
      backoff:
        initial-interval: 2000
        max-interval: 10000
        multiplier: 2
      max-attempts: 3
    # The embedding model and dimensions MUST match ragr-ingest's: each question is embedded with the
    # same model to search what ingestion wrote. A different dimension fails loudly; a different model
    # with the same dimension fails silently, with poor matches.
    vectorstore:
      pgvector:
        table-name: vector_store
        schema-name: public
        initialize-schema: false     # created by ragr-ingest's Flyway V1
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768              # nomic-embed-text
    #        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
    #        remove-existing-vector-store-table: true
    #    openai:
    #      api-key: _
    #      base-url: http://localhost:12434/engines
    #      embedding:
    #        options:
    #          model: ai/qwen3-embedding-vllm:latest # Switched to a model compatible with HNSW
    #      chat:
    #        options:
    #          model: ai/llama3.2:latest # Keep using llama3.2 for chat
    ollama:
      base-url: http://localhost:11434
      embedding:
        model: nomic-embed-text
        keep-alive: "-1"   # keep the model loaded: no ~28s cold start on the first question
      chat:
        # Chosen for citations, the thing the whole pipeline exists to produce: it cites only the pages
        # it was given.
        model: gemma4:e2b
        # Do not remove. Thinking output is never read, and with it on answers run into num-predict and
        # are cut off mid-sentence. Quoted because it binds to an enum, not a boolean.
        think: "false"
        # The model's own default is 1.0, and Spring AI sends nothing unless it is set here. Grounded
        # answers want a low temperature.
        temperature: 0.2
        # The only limit on answer length, so a looping generation cannot run unbounded. Well above
        # the longest answer.
        num-predict: 1024
        # Do not remove. Spring AI sends nothing unless set, and the runner's own default disables the
        # repetition penalty, which lets a generation loop.
        repeat-penalty: 1.1
        # Far below the model's native 131072, to keep memory down. Must stay well above the largest
        # prompt: Ollama cuts an over-long prompt from the START, silently dropping the system prompt.
        num-ctx: 8192
    chat:
      # The final prompt sent to Ollama, after the retrieved passages were added.
      observations:
        log-prompt: true
        log-completion: true
        include-error-logging: true
      client:
        # The prompt as the caller wrote it, before the advisors ran.
        observations:
          log-prompt: true
          log-completion: true

logging:
  level:
    org:
      springframework:
        ai:
          vectorstore: DEBUG
          chat:
            client:
              advisor: DEBUG
        jdbc:
          core: DEBUG

app:
  embedding:
    # Added to every question before it is embedded. MUST pair with ragr-ingest's passage prefix
    # ("search_document: ") and change with the model - see app.embedding there.
    task-prefix: "search_query: "
  rag:
    # Retrieval only. What is chunked and stored is set in ragr-ingest, under app.ingestion.
    top-k: 5
    # Between the weakest useful chunk and the best chunk for a question the corpus cannot answer, over
    # the golden questions. Re-measure after any embedding change: the scores belong to the model.
    similarity-threshold: 0.65
    # One query fetches this many chunks above pool-floor. The top-k above the threshold go into the
    # prompt; the rest go to ragr-eval, to measure what retrieval left out.
    pool-size: 10
    pool-floor: 0.0
    # Hybrid search: names from the question searched as exact text beside the vector search.
    keyword:
      enabled: true
      # A name found in more chunks than this is ignored as too common.
      max-matches: 20
      # Keyword matches take at most this many of the top-k prompt places, from the weakest vector chunks.
      slots: 2
  ai:
    max-chat-messages: 10

  events:
    chat-turns:
      enabled: true
      topic: rag.chat.turn.completed
      # Evaluation keeps up within seconds; the rest of the window allows replaying past turns through
      # a new metric. A few KB per turn.
      retention: 3d
    feedback:
      topic: rag.chat.feedback
      retention: 3d
