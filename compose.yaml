# Shared by the three application services at the end of the file. Anchors must precede their use.
x-ragr-common-env: &ragr-common-env
  SPRING_AI_OLLAMA_BASE_URL: "http://host.docker.internal:11434"
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: "http://otel-collector:4318/v1/traces"
  LOKI_URL: "http://loki:3100/loki/api/v1/push"

x-ragr-healthcheck: &ragr-healthcheck
  interval: 10s
  timeout: 3s
  retries: 3
  # Failures inside this window do not count, and start_interval polls fast within it, so
  # `up --wait` returns soon after the application is actually ready.
  start_period: 120s
  start_interval: 2s

services:
  pgvector:
    container_name: ai_pgvector
    image: 'pgvector/pgvector:pg16'
    environment:
      - 'POSTGRES_DB=ragdatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    volumes:
      - ./docker-volume/postgres:/var/lib/postgresql/data
    labels:
      - "org.springframework.boot.service-connection=postgres"
    ports:
      - '5432:5432'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d docmind" ]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    container_name: ai_pgadmin
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@localhost.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 5050
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - ./docker/pgadmin/docker_pgadmin_servers.json:/pgadmin4/servers.json
      - ./docker-volume/pgadmin:/var/lib/pgadmin
    ports:
      - '5050:5050'
    entrypoint:
      - "/bin/sh"
      - "-c"
      - "/bin/echo 'pgvector:5432:*:myuser:secret' > /tmp/pgpassfile && chmod 600 /tmp/pgpassfile && /entrypoint.sh"
    depends_on:
      - pgvector
    labels:
      - "org.springframework.boot.readiness-check.skip=true"

  redis:
    image: redis/redis-stack:latest
    container_name: ai_redis
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - ./docker-volume/redis:/data

  # Carries finished chat turns and ratings from chat to evaluation, keeping evaluation off the chat
  # path. The GraalVM native image, not apache/kafka: it is meant for local development, which this is,
  # and saves a JVM heap on a machine short of memory.
  #
  # Every setting is spelled out because the image drops ALL its defaults once any KAFKA_* variable is
  # set. These match the defaults except log.dirs (out of /tmp) and topic auto-creation (off, so a
  # mistyped topic name fails instead of creating an empty topic nothing reads).
  kafka:
    image: apache/kafka-native:4.3.1
    container_name: ai_kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: 'ragr-local-kraft-01'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093'
      # Two listeners, because a client reconnects to whatever address its listener advertises.
      # PLAINTEXT serves applications on the host as localhost:9092. INTERNAL, not published, serves
      # containers - the applications and kafka-console - as kafka:29092; given localhost, a container
      # would connect to itself.
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092,INTERNAL://kafka:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
    volumes:
      # Persisted, so retained turns survive a restart and can be replayed through a new metric.
      - ./docker-volume/kafka:/var/lib/kafka/data
    # Without this, `up --wait` calls the broker ready while it is still recovering its log (about a
    # minute), and the applications cannot connect. The image has no Kafka tools, so it probes the port,
    # which opens exactly when the broker starts serving.
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "29092" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 120s
      start_interval: 2s

  # A browser view of Kafka: the stored turns and ratings as JSON, and the ragr-eval group's offsets.
  # Grafana shows rates and lag; this shows the messages. Redpanda Console because it is a small Go
  # binary (~50 MiB), not a JVM. The limit is ~2.5x that, so a leak ends in a kill rather than taking
  # memory from the models. Pinned, not latest, for the same reason.
  kafka-console:
    image: redpandadata/console:v3.12.0
    container_name: ai_kafka-console
    mem_limit: 128m
    # It gives up after ~31 s without the broker, and a Kafka restart takes about a minute, so it is
    # restarted until the broker answers.
    restart: on-failure
    environment:
      KAFKA_BROKERS: 'kafka:29092'
      SERVER_LISTENPORT: 8082
    ports:
      - "8082:8082"
    depends_on:
      kafka:
        condition: service_healthy
    labels:
      - "org.springframework.boot.readiness-check.skip=true"

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: ai_redis-exporter
    command: [ "--redis.addr=redis://redis:6379" ]
    ports:
      - "9121:9121"
    depends_on:
      - redis
    labels:
      - "org.springframework.boot.readiness-check.skip=true"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: ai_postgres-exporter
    environment:
      # Same dev credentials as the pgvector service above.
      DATA_SOURCE_NAME: "postgresql://myuser:secret@pgvector:5432/ragdatabase?sslmode=disable"
    command:
      # Per-table and per-index stats are off by default, and vector_store's index versus sequential
      # scans are the main reason for this exporter. Note the names: stat_user_tables, statio_user_indexes.
      - "--collector.stat_user_tables"
      - "--collector.statio_user_indexes"
      - "--collector.stat_activity"
      - "--collector.stat_database"
    ports:
      - "9187:9187"
    depends_on:
      - pgvector
    labels:
      - "org.springframework.boot.readiness-check.skip=true"

  # Observability Stack
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: ai_otel-collector
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./docker/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      - tempo
    labels:
      - "org.springframework.boot.readiness-check.skip=true"

  prometheus:
    image: prom/prometheus:latest
    container_name: ai_prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      # Overriding `command` discards the image's default args, so restate the data path.
      - '--storage.tsdb.path=/prometheus'
      # Required to STORE exemplars scraped from the app; without it they are silently dropped.
      - '--enable-feature=exemplar-storage'
      # Required to ACCEPT Tempo's metrics_generator remote_write (span metrics + service graph).
      - '--web.enable-remote-write-receiver'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./docker-volume/prometheus:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9090/-/healthy || exit 1" ]
      interval: 5s
      timeout: 1s
      retries: 10
    labels:
      - "org.springframework.boot.readiness-check.skip=true"

  grafana:
    image: grafana/grafana:latest
    container_name: ai_grafana
    volumes:
      - ./docker-volume/grafana:/var/lib/grafana
      - ./docker/grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SERVER_HTTP_PORT=3000
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1" ]
      interval: 5s
      timeout: 1s
      retries: 10
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki
    labels:
      - "org.springframework.boot.readiness-check.skip=true"

  tempo:
    image: grafana/tempo:latest
    container_name: ai_tempo
    command: [ "-config.file=/etc/tempo/tempo.yaml" ]
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo/tempo.yaml
      - ./docker-volume/tempo-data:/var/tempo
    ports:
      - "3200:3200"   # tempo
    # No healthcheck: the image has no /bin/sh, so a check could never pass, and `up --wait` (which
    # Spring Boot runs on a cold start) would abort. Nothing waits on Tempo being healthy.
    labels:
      - "org.springframework.boot.readiness-check.skip=true"

  loki:
    image: grafana/loki:latest
    container_name: ai_loki
    command: [ "-config.file=/etc/loki/local-config.yaml" ]
    volumes:
      - ./docker/loki/local-config.yaml:/etc/loki/local-config.yaml
    ports:
      - "3100:3100" # Loki API
    # No healthcheck, as for Tempo: the image has no /bin/sh. Nothing waits on Loki being healthy.
    labels:
      - "org.springframework.boot.readiness-check.skip=true"

  # The three applications, for the Docker run mode.
  #
  # - Behind the `apps` profile, so a plain `docker compose up` - including the one ragr-app runs when
  #   started from IntelliJ - starts only the infrastructure. Start them with ./ragr.ps1, which packages
  #   the jars first. Never set COMPOSE_PROFILES=apps in a .env file: an IntelliJ ragr-app would then
  #   start its own container as well.
  # - The same host ports as an IntelliJ run, so Prometheus, Swagger and the golden suite work in either
  #   mode, and an application cannot run in both at once.
  # - Only the addresses differ, as environment variables over the localhost defaults in each YAML.
  #   Ollama stays on the host for the GPU (host.docker.internal); Kafka is reached on INTERNAL.
  # - depends_on lists only infrastructure, never another application, so each starts alone. No restart
  #   policy, so Docker Desktop starting at login does not bring them up behind an IntelliJ session.
  #
  # Ollama is not in a container (the WSL2 VM cannot use the iGPU) nor replaced by Docker Model Runner
  # (slower prompt reading and more memory, measured 2 Oct 2026).
  ragr-app:
    profiles: [ "apps" ]
    image: ragr-app:local
    container_name: ai_ragr-app
    build:
      context: .
      args:
        MODULE: ragr-app
    # Above the JVM's worst case (heap cap plus ~218 MiB outside the heap, measured), so a full heap is an
    # OutOfMemoryError the log explains, never a silent kill. The limit stops a native leak taking memory
    # from the models; it reserves nothing.
    mem_limit: 650m
    # Docker here waited only 3 s before killing the JVM, cutting off requests, logs and traces. 40 s
    # covers Spring Boot's 30 s graceful shutdown.
    stop_grace_period: 40s
    environment:
      <<: *ragr-common-env
      JDK_JAVA_OPTIONS: "-Xmx384m -XX:+UseSerialGC"
      # Docker Compose support is how IntelliJ starts the stack; inside a container it has nothing to do.
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://pgvector:5432/ragdatabase"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      APP_REDIS_HOST: "redis"
    ports:
      - "8080:8080"
      - "9095:9095"
    healthcheck:
      <<: *ragr-healthcheck
      test: [ "CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:9095/actuator/health" ]
    depends_on:
      pgvector:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
    labels:
      - "org.springframework.boot.readiness-check.skip=true"

  ragr-ingest:
    profiles: [ "apps" ]
    image: ragr-ingest:local
    container_name: ai_ragr-ingest
    build:
      context: .
      args:
        MODULE: ragr-ingest
    # 512 MB heap cap plus ~245 MiB outside it, with room for upload threads - see ragr-app above.
    mem_limit: 850m
    environment:
      <<: *ragr-common-env
      JDK_JAVA_OPTIONS: "-Xmx512m -XX:+UseSerialGC"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://pgvector:5432/ragdatabase"
    ports:
      - "8081:8081"
      - "9097:9097"
    healthcheck:
      <<: *ragr-healthcheck
      test: [ "CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:9097/actuator/health" ]
    # An upload in flight is one long request; Boot's graceful shutdown gives it 30 s to finish.
    stop_grace_period: 40s
    depends_on:
      pgvector:
        condition: service_healthy
    labels:
      - "org.springframework.boot.readiness-check.skip=true"

  ragr-eval:
    profiles: [ "apps" ]
    image: ragr-eval:local
    container_name: ai_ragr-eval
    build:
      context: .
      args:
        MODULE: ragr-eval
    # 256 MB heap cap plus ~184 MiB outside it - see ragr-app above.
    mem_limit: 480m
    # Covers app.eval.judge.shutdown-wait-seconds (20) for the judgement in flight; raise both together.
    stop_grace_period: 40s
    environment:
      <<: *ragr-common-env
      JDK_JAVA_OPTIONS: "-Xmx256m -XX:+UseSerialGC"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://pgvector:5432/ragdatabase?currentSchema=eval"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      # The idle gate reads ragr-app's active-generations gauge from its management port.
      APP_EVAL_JUDGE_IDLE_GATE_CHAT_ACTUATOR_URL: "http://ragr-app:9095"
    ports:
      - "9096:9096"
    healthcheck:
      <<: *ragr-healthcheck
      test: [ "CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:9096/actuator/health" ]
    depends_on:
      pgvector:
        condition: service_healthy
      kafka:
        condition: service_healthy
    labels:
      - "org.springframework.boot.readiness-check.skip=true"

volumes:
  pgvector:
  pgadmin:
  redis:
  prometheus:
  grafana:
  tempo:
  tempo-data: