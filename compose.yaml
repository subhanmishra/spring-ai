services:
  pgvector:
    container_name: ai_pgvector
    image: 'pgvector/pgvector:pg16'
    environment:
      - 'POSTGRES_DB=ragdatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    volumes:
      - ./docker-volume/postgres:/var/lib/postgresql/data
    labels:
      - "org.springframework.boot.service-connection=postgres"
    ports:
      - '5432:5432'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d docmind" ]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    container_name: ai_pgadmin
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@localhost.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 5050
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - ./docker/pgadmin/docker_pgadmin_servers.json:/pgadmin4/servers.json
      - ./docker-volume/pgadmin:/var/lib/pgadmin
    ports:
      - '5050:5050'
    entrypoint:
      - "/bin/sh"
      - "-c"
      - "/bin/echo 'pgvector:5432:*:myuser:secret' > /tmp/pgpassfile && chmod 600 /tmp/pgpassfile && /entrypoint.sh"
    depends_on:
      - pgvector
    labels:
      - "org.springframework.boot.readiness-check.skip=true"

  redis:
    image: redis/redis-stack:latest
    container_name: ai_redis
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - ./docker-volume/redis:/data

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: ai_redis-exporter
    command: [ "--redis.addr=redis://redis:6379" ]
    ports:
      - "9121:9121"
    depends_on:
      - redis
    labels:
      - "org.springframework.boot.readiness-check.skip=true"

  # Observability Stack
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: ai_otel-collector
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./docker/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      - tempo
    labels:
      - "org.springframework.boot.readiness-check.skip=true"

  prometheus:
    image: prom/prometheus:latest
    container_name: ai_prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      # Overriding `command` discards the image's default args, so restate the data path.
      - '--storage.tsdb.path=/prometheus'
      # Required to STORE exemplars scraped from the app; without it they are silently dropped.
      - '--enable-feature=exemplar-storage'
      # Required to ACCEPT Tempo's metrics_generator remote_write (span metrics + service graph).
      - '--web.enable-remote-write-receiver'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./docker-volume/prometheus:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9090/-/healthy || exit 1" ]
      interval: 5s
      timeout: 1s
      retries: 10
    labels:
      - "org.springframework.boot.readiness-check.skip=true"

  grafana:
    image: grafana/grafana:latest
    container_name: ai_grafana
    volumes:
      - ./docker-volume/grafana:/var/lib/grafana
      - ./docker/grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SERVER_HTTP_PORT=3000
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1" ]
      interval: 5s
      timeout: 1s
      retries: 10
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki
    labels:
      - "org.springframework.boot.readiness-check.skip=true"

  tempo:
    image: grafana/tempo:latest
    container_name: ai_tempo
    command: [ "-config.file=/etc/tempo/tempo.yaml" ]
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo/tempo.yaml
      - ./docker-volume/tempo-data:/var/tempo
    ports:
      - "3200:3200"   # tempo
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:3200/ready || exit 1" ]
      interval: 5s
      timeout: 1s
      retries: 10
    labels:
      - "org.springframework.boot.readiness-check.skip=true"

  loki:
    image: grafana/loki:latest
    container_name: ai_loki
    command: [ "-config.file=/etc/loki/local-config.yaml" ]
    volumes:
      - ./docker/loki/local-config.yaml:/etc/loki/local-config.yaml
    ports:
      - "3100:3100" # Loki API
    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --tries=1 --output-document=- http://localhost:3100/ready | grep -q -w ready || exit 1" ]
      interval: 5s
      timeout: 1s
      retries: 10
    labels:
      - "org.springframework.boot.readiness-check.skip=true"

volumes:
  pgvector:
  pgadmin:
  redis:
  prometheus:
  grafana:
  tempo:
  tempo-data: