services:
  pgvector:
    container_name: ai_pgvector
    image: 'pgvector/pgvector:pg16'
    environment:
      - 'POSTGRES_DB=ragdatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    volumes:
      - ./docker-volume/postgres:/var/lib/postgresql/data
    labels:
      - "org.springframework.boot.service-connection=postgres"
    ports:
      - '5432:5432'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d docmind" ]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    container_name: ai_pgadmin
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@localhost.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 5050
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - ./docker/pgadmin/docker_pgadmin_servers.json:/pgadmin4/servers.json
      - ./docker-volume/pgadmin:/var/lib/pgadmin
    ports:
      - '5050:5050'
    entrypoint:
      - "/bin/sh"
      - "-c"
      - "/bin/echo 'pgvector:5432:*:myuser:secret' > /tmp/pgpassfile && chmod 600 /tmp/pgpassfile && /entrypoint.sh"
    depends_on:
      - pgvector
  redis:
    image: redis/redis-stack:latest
    container_name: ai_redis
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - ./docker-volume/redis:/data

volumes:
  pgvector:
  pgadmin:
  redis: