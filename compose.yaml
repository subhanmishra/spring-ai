# Shared by the three application services at the end of the file. Anchors must precede their use.
x-ragr-common-env: &ragr-common-env
  SPRING_AI_OLLAMA_BASE_URL: "http://host.docker.internal:11434"
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: "http://otel-collector:4318/v1/traces"
  LOKI_URL: "http://loki:3100/loki/api/v1/push"

x-ragr-healthcheck: &ragr-healthcheck
  interval: 10s
  timeout: 3s
  retries: 3
  # Failures inside this window do not count, and start_interval polls fast within it, so
  # `up --wait` returns soon after the application is actually ready.
  start_period: 120s
  start_interval: 2s

services:
  pgvector:
    container_name: ai_pgvector
    image: 'pgvector/pgvector:pg16'
    environment:
      - 'POSTGRES_DB=ragdatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    volumes:
      - ./docker-volume/postgres:/var/lib/postgresql/data
    labels:
      - "org.springframework.boot.service-connection=postgres"
    ports:
      - '5432:5432'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d docmind" ]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    container_name: ai_pgadmin
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@localhost.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 5050
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - ./docker/pgadmin/docker_pgadmin_servers.json:/pgadmin4/servers.json
      - ./docker-volume/pgadmin:/var/lib/pgadmin
    ports:
      - '5050:5050'
    entrypoint:
      - "/bin/sh"
      - "-c"
      - "/bin/echo 'pgvector:5432:*:myuser:secret' > /tmp/pgpassfile && chmod 600 /tmp/pgpassfile && /entrypoint.sh"
    depends_on:
      - pgvector
    labels:
      - "org.springframework.boot.readiness-check.skip=true"

  redis:
    image: redis/redis-stack:latest
    container_name: ai_redis
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - ./docker-volume/redis:/data

  # Carries completed chat turns from the app to evaluation, so scoring and LLM judging stay off the
  # chat path. The GraalVM native image rather than apache/kafka: it is labelled experimental and for
  # local development only, which is exactly this use, and a JVM broker is a heap this memory-tight
  # host would rather not carry.
  #
  # Every setting is spelled out because the image applies its built-in defaults only when NO KAFKA_*
  # variable is set - set one and the rest vanish. These mirror those defaults except for log.dirs,
  # which the defaults put in /tmp inside the container, and topic auto-creation, which is off so a
  # mistyped topic name fails instead of quietly creating an empty topic nothing reads.
  kafka:
    image: apache/kafka-native:4.3.1
    container_name: ai_kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: 'ragr-local-kraft-01'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093'
      # Two listeners because a client is told to reconnect to whatever address the listener it came in
      # on advertises. PLAINTEXT serves the three applications on the host, as localhost:9092. INTERNAL,
      # which is not published, serves containers in this compose network - kafka-console - as
      # kafka:29092; handed localhost:9092 instead, a container reconnects to itself and fails.
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092,INTERNAL://kafka:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
    volumes:
      # Persisted so the topic's retention window survives a restart: replaying retained turns
      # through a new judge or metric is one of the reasons for putting a log here at all.
      - ./docker-volume/kafka:/var/lib/kafka/data
    # Without a healthcheck `up --wait` counts the broker ready the moment its process starts, while
    # it is still recovering its log - measured at 62s after a restart and ~75s on a cold start, during
    # which ragr-app and ragr-eval start and cannot connect. The native image has no Kafka CLI tools,
    # only BusyBox, so this probes the port: the broker listeners open on the same millisecond the log
    # reports "Enabling request processing", measured, so an open port means it is serving.
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "29092" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 120s
      start_interval: 2s

  # A browser view of the broker: topics, the retained chat turns decoded as JSON with their traceparent
  # header, and the ragr-eval consumer group's offsets. The Grafana Kafka row shows rates and lag; this
  # shows the messages. Redpanda Console rather than a JVM-based UI because it is a Go binary: measured
  # at 50 MiB idle and 48-50 MiB while streaming the whole topic five times, with no growth - the
  # broker itself uses ~190 MiB. The limit is ~2.5x that, so a leak shows up as an OOM kill rather than
  # as memory quietly taken from the Ollama models. Pinned, not latest, for the same reason.
  kafka-console:
    image: redpandadata/console:v3.12.0
    container_name: ai_kafka-console
    mem_limit: 128m
    # It waits for the broker's healthcheck, but gives up after ~31s of retries and exits if the broker
    # goes away later - a restart of Kafka alone takes about a minute - so it is restarted until the
    # broker answers again.
    restart: on-failure
    environment:
      KAFKA_BROKERS: 'kafka:29092'
      SERVER_LISTENPORT: 8082
    ports:
      - "8082:8082"
    depends_on:
      kafka:
        condition: service_healthy
    labels:
      - "org.springframework.boot.readiness-check.skip=true"

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: ai_redis-exporter
    command: [ "--redis.addr=redis://redis:6379" ]
    ports:
      - "9121:9121"
    depends_on:
      - redis
    labels:
      - "org.springframework.boot.readiness-check.skip=true"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: ai_postgres-exporter
    environment:
      # Same dev credentials as the pgvector service above.
      DATA_SOURCE_NAME: "postgresql://myuser:secret@pgvector:5432/ragdatabase?sslmode=disable"
    command:
      # Per-table and per-index stats are off by default, and vector_store's index-vs-sequential
      # scan counts are the main reason for running this exporter here.
      # Note the asymmetric naming: stat_user_tables but statio_user_indexes.
      - "--collector.stat_user_tables"
      - "--collector.statio_user_indexes"
      - "--collector.stat_activity"
      - "--collector.stat_database"
    ports:
      - "9187:9187"
    depends_on:
      - pgvector
    labels:
      - "org.springframework.boot.readiness-check.skip=true"

  # Observability Stack
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: ai_otel-collector
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./docker/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      - tempo
    labels:
      - "org.springframework.boot.readiness-check.skip=true"

  prometheus:
    image: prom/prometheus:latest
    container_name: ai_prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      # Overriding `command` discards the image's default args, so restate the data path.
      - '--storage.tsdb.path=/prometheus'
      # Required to STORE exemplars scraped from the app; without it they are silently dropped.
      - '--enable-feature=exemplar-storage'
      # Required to ACCEPT Tempo's metrics_generator remote_write (span metrics + service graph).
      - '--web.enable-remote-write-receiver'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./docker-volume/prometheus:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9090/-/healthy || exit 1" ]
      interval: 5s
      timeout: 1s
      retries: 10
    labels:
      - "org.springframework.boot.readiness-check.skip=true"

  grafana:
    image: grafana/grafana:latest
    container_name: ai_grafana
    volumes:
      - ./docker-volume/grafana:/var/lib/grafana
      - ./docker/grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SERVER_HTTP_PORT=3000
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1" ]
      interval: 5s
      timeout: 1s
      retries: 10
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki
    labels:
      - "org.springframework.boot.readiness-check.skip=true"

  tempo:
    image: grafana/tempo:latest
    container_name: ai_tempo
    command: [ "-config.file=/etc/tempo/tempo.yaml" ]
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo/tempo.yaml
      - ./docker-volume/tempo-data:/var/tempo
    ports:
      - "3200:3200"   # tempo
    # No healthcheck, for the same reason as Loki: current grafana/tempo:latest images ship without
    # /bin/sh, so a CMD-SHELL check can never run, the container reports unhealthy, and `docker compose
    # up --wait` - which Spring Boot runs on a cold start - fails and aborts startup. Nothing waits on
    # Tempo being healthy - the collector's and grafana's depends_on are plain ordering.
    labels:
      - "org.springframework.boot.readiness-check.skip=true"

  loki:
    image: grafana/loki:latest
    container_name: ai_loki
    command: [ "-config.file=/etc/loki/local-config.yaml" ]
    volumes:
      - ./docker/loki/local-config.yaml:/etc/loki/local-config.yaml
    ports:
      - "3100:3100" # Loki API
    # No healthcheck: current grafana/loki:latest images ship without /bin/sh, so a CMD-SHELL check can
    # never run, the container reports unhealthy, and Spring Boot's compose integration aborts startup.
    # Nothing waits on Loki being healthy - grafana's depends_on is plain ordering.
    labels:
      - "org.springframework.boot.readiness-check.skip=true"

  # The three applications, for the Docker run mode. Behind the `apps` profile, so a plain
  # `docker compose up` - including the one ragr-app's own Docker Compose integration runs when it is
  # started from IntelliJ - still starts the infrastructure only. Start them with ./ragr.ps1, which
  # packages the jars on the host first; `docker compose --profile apps up --build` on its own builds
  # from whatever is already in target/. Never set COMPOSE_PROFILES=apps in a .env file: compose reads
  # it, and an IntelliJ-launched ragr-app would then start its own container and clash on its ports.
  #
  # Each publishes the same host ports as its IntelliJ run, so Prometheus's host.docker.internal
  # targets, the Swagger links and the golden suite work unchanged in either mode, and an application
  # cannot be up in both at once - the second fails to bind.
  #
  # Only the addresses differ from an IntelliJ run, as environment variables over the localhost
  # defaults in each application's YAML. Ollama stays native on Windows for the iGPU, reached through
  # host.docker.internal; Kafka through the INTERNAL listener.
  #
  # Ollama is not containerised, nor replaced by Docker Model Runner. In a container it would run in the
  # WSL2 VM, which cannot reach the Iris Xe through Vulkan - CPU only. Model Runner runs llama.cpp on
  # the host and does use the iGPU (Docker Desktop 4.93, Vulkan, every layer offloaded), but measured
  # 2 Oct 2026 on gemma4 e2b Q4_K_M with a 2.5k-token RAG prompt, one engine loaded at a time:
  # prompt ingestion 143 tok/s against Ollama's 205, generation level (12.0 vs 12.3 tok/s). It also
  # defaults to thinking on (off only via chat_template_kwargs.enable_thinking), a 131072-token context
  # on 4 slots plus the vision projector - 5.5 GB resident against Ollama's 1.7 - and its weights
  # differ from Ollama's (4.09 GB file vs 7.2), so a switch means a new golden baseline and a full
  # re-ingest. Worth revisiting only if its prompt ingestion catches up.
  #
  # depends_on is the infrastructure each one cannot start without, never another application, so
  # each can be started and restarted alone. No restart policy: Docker Desktop starting at login must
  # not bring the applications up behind an IntelliJ session.
  ragr-app:
    profiles: [ "apps" ]
    image: ragr-app:local
    container_name: ai_ragr-app
    build:
      context: .
      args:
        MODULE: ragr-app
    # The limits sit above each JVM's worst case - heap cap plus what it uses outside the heap - so a
    # full heap still ends in an OutOfMemoryError the log explains, never a silent OOM kill; they are
    # there to stop a native leak taking memory from the Ollama models. Measured 1 Oct 2026 after a
    # grounded turn, as cgroup anon minus committed heap: 218 MiB outside the heap for ragr-app,
    # 245 for ragr-ingest, 184 for ragr-eval. A limit reserves nothing, so it costs no memory.
    mem_limit: 650m
    # Without one, Docker (29.8 here) waits only 3 s after SIGTERM before SIGKILL - measured, not the
    # 10 s often quoted. A chat turn in flight takes far longer, and Boot's graceful shutdown waits up to
    # 30 s for it, so every stop mid-turn ended in exit 137, the turn cut off and the last logs and
    # spans never flushed. 40 s covers the 30 s phase and what comes after it.
    stop_grace_period: 40s
    environment:
      <<: *ragr-common-env
      JDK_JAVA_OPTIONS: "-Xmx384m -XX:+UseSerialGC"
      # The compose integration is IntelliJ's way of starting the stack; inside the network it has no
      # compose.yaml and no docker CLI.
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://pgvector:5432/ragdatabase"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      APP_REDIS_HOST: "redis"
    ports:
      - "8080:8080"
      - "9095:9095"
    healthcheck:
      <<: *ragr-healthcheck
      test: [ "CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:9095/actuator/health" ]
    depends_on:
      pgvector:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
    labels:
      - "org.springframework.boot.readiness-check.skip=true"

  ragr-ingest:
    profiles: [ "apps" ]
    image: ragr-ingest:local
    container_name: ai_ragr-ingest
    build:
      context: .
      args:
        MODULE: ragr-ingest
    # 512 MB heap cap plus ~245 MiB outside it, with room for upload threads - see ragr-app above.
    mem_limit: 850m
    environment:
      <<: *ragr-common-env
      JDK_JAVA_OPTIONS: "-Xmx512m -XX:+UseSerialGC"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://pgvector:5432/ragdatabase"
    ports:
      - "8081:8081"
      - "9097:9097"
    healthcheck:
      <<: *ragr-healthcheck
      test: [ "CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:9097/actuator/health" ]
    # An upload in flight is one long request; Boot's graceful shutdown gives it 30 s to finish.
    stop_grace_period: 40s
    depends_on:
      pgvector:
        condition: service_healthy
    labels:
      - "org.springframework.boot.readiness-check.skip=true"

  ragr-eval:
    profiles: [ "apps" ]
    image: ragr-eval:local
    container_name: ai_ragr-eval
    build:
      context: .
      args:
        MODULE: ragr-eval
    # 256 MB heap cap plus ~184 MiB outside it - see ragr-app above.
    mem_limit: 480m
    # Docker's 3 s default - see ragr-app - does not cover a judgement in flight: shutdown waits up to
    # app.eval.online.judge-shutdown-wait-seconds (20) for it before interrupting, after the Kafka
    # consumer has left its group. Raising that wait means raising this too.
    stop_grace_period: 40s
    environment:
      <<: *ragr-common-env
      JDK_JAVA_OPTIONS: "-Xmx256m -XX:+UseSerialGC"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://pgvector:5432/ragdatabase?currentSchema=eval"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
    ports:
      - "9096:9096"
    healthcheck:
      <<: *ragr-healthcheck
      test: [ "CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:9096/actuator/health" ]
    depends_on:
      pgvector:
        condition: service_healthy
      kafka:
        condition: service_healthy
    labels:
      - "org.springframework.boot.readiness-check.skip=true"

volumes:
  pgvector:
  pgadmin:
  redis:
  prometheus:
  grafana:
  tempo:
  tempo-data: