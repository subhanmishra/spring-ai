management:
  endpoints:
    web:
      exposure:
        include: "health,metrics,prometheus"
  observations:
    key-values:
      application: ${spring.application.name}
  server:
    port: 9095
  otlp:
    tracing:
      endpoint: "http://localhost:4318/v1/traces"
  tracing:
    sampling:
      probability: 1.0
  prometheus:
    metrics:
      export:
        enabled: true
        step: 5s
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
      env: local
    distribution:
      # Histograms only for the four timers the Grafana dashboard actually runs histogram_quantile
      # against (and http.server.requests additionally carries the dashboard's only exemplars).
      # `all: true` published buckets for every timer in the app: 2,407 bucket lines out of 2,623
      # exported lines, i.e. 92% of a 528 KB scrape body every 15s, for eighteen bucket families of
      # which the dashboard queried four. Everything dropped here still exports _count, _sum and
      # _max, so rates and averages are unaffected - only quantiles need buckets.
      #
      # These keys are PREFIX matches, not exact ones: Micrometer's PropertiesMeterFilter walks a
      # meter's name from most specific to least, so `spring.ai.advisor` also matches the separate
      # `spring.ai.advisor.active` LongTaskTimer. Those .active meters are not on the dashboard and
      # were 319 bucket lines between them, so each is switched off explicitly. Removing a `false`
      # line silently re-enables it via its parent.
      percentiles-histogram:
        "[http.server.requests]": true
        "[gen_ai.client.operation]": true
        "[spring.ai.advisor]": true
        "[db.vector.client.operation]": true
        # Added for the AI/RAG dashboard's "ChatClient end-to-end latency" panel, which had been
        # querying histogram_quantile against a timer that published no buckets and was therefore
        # permanently empty. This is the user-facing number - the whole turn including retrieval and
        # generation - so quantiles on it are worth the bucket cost.
        "[spring.ai.chat.client]": true
        "[http.server.requests.active]": false
        "[gen_ai.client.operation.active]": false
        "[spring.ai.advisor.active]": false
        "[db.vector.client.operation.active]": false
        # Required alongside the `true` above, NOT optional: these keys are PREFIX matches, so
        # `spring.ai.chat.client` also switches on the separate `spring.ai.chat.client.active`
        # LongTaskTimer, which no panel queries and which was 319 bucket lines for its siblings.
        "[spring.ai.chat.client.active]": false
    enable:
      all: true

loki:
  url: http://localhost:3100/loki/api/v1/push

spring:
  application:
    name: spring-ai-ragr
  docker:
    compose:
      lifecycle-management: START_AND_STOP
  datasource:
    url: jdbc:postgresql://localhost:5432/ragdatabase
    username: myuser
    password: secret
    hikari:
      pool-name: rag-hikari-pool
      maximum-pool-size: 20          # app.rag.ingestion-concurrency must stay well below this
      minimum-idle: 5                # must be < maximum-pool-size, otherwise idle-timeout never reaps
      connection-timeout: 30000      # 30s - fail rather than queue forever on an exhausted pool
      idle-timeout: 300000           # 5m
      keepalive-time: 120000         # 2m - stops idle connections being silently dropped by NAT/firewalls
      max-lifetime: 1800000          # 30m - must stay below any DB-side or proxy-side connection lifetime
      validation-timeout: 5000
      leak-detection-threshold: 60000
      data-source-properties:
        reWriteBatchedInserts: true  # collapse JDBC batches into one multi-row INSERT
  ai:
    retry:
      backoff:
        initial-interval: 2000
        max-interval: 10000
        multiplier: 2
      max-attempts: 3
    vectorstore:
      pgvector:
        table-name: vector_store
        schema-name: public
        initialize-schema: false
        index-type: HNSW # Reverted to HNSW as it works with 768 dimensions
        distance-type: COSINE_DISTANCE
        dimensions: 768 # Set to 768 for nomic-embed-text
    #        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
    #        remove-existing-vector-store-table: true
    #    openai:
    #      api-key: _
    #      base-url: http://localhost:12434/engines
    #      embedding:
    #        options:
    #          model: ai/qwen3-embedding-vllm:latest # Switched to a model compatible with HNSW
    #      chat:
    #        options:
    #          model: ai/llama3.2:latest # Keep using llama3.2 for chat
    ollama:
      base-url: http://localhost:11434
      embedding:
        model: nomic-embed-text
        keep-alive: "-1"   # pin the embedding model in memory: avoids the ~28s cold start, and the
                           # runner-startup race that concurrent batches would otherwise hit
      chat:
        # Gemma 4 E2B, switched from llama3.2 for CITATION FIDELITY - the thing the citation header
        # in DocumentIngestionService and QA_PROMPT_TEMPLATE in SpringAiConfig exist to produce.
        # Measured on three retrieval-grounded queries against the 645-page manual, with both models
        # given identical prompts, context and options: llama3.2 cited NOTHING three times out of
        # three, once parroting the instruction back ("Remember to cite your sources") instead of
        # obeying it. gemma4:e2b cited seven pages across the same three, every one genuinely in the
        # retrieved context. A follow-up five-query run cited 18 pages, all valid, none fabricated.
        #
        # It is also CHEAPER than the model it replaces, which the 7.2 GB file hides: the E-series
        # offloads per-layer embeddings, so Ollama reports it resident at 1.59 GB against llama3.2's
        # 2.81-2.88 GB. It coexists with nomic-embed-text indefinitely (five consecutive turns, 0s
        # load every time, free RAM steady at ~2 GB), and generates FASTER - 12.8-13.9 tok/s against
        # 10.7-12.1, i.e. 53-70s per answer against 58-91s.
        model: gemma4:e2b
        # Gemma 4 advertises a `thinking` capability and Spring AI 2.0.1 returns that separately, in
        # OllamaApi.Message.thinking, which ChatService never reads. Left enabled it is pure waste in
        # BOTH directions: 1,790-2,331 characters per answer of reasoning we discard, AND it pushed
        # all three answers into the num-predict ceiling below, truncating them mid-sentence. With it
        # off, the same answers finish on their own in 656-837 tokens. Do not remove this.
        #
        # QUOTED deliberately. This binds to the enum OllamaThinkProperties (TRUE/FALSE/HIGH/MEDIUM/
        # LOW), not to a boolean - so an unquoted `false` is parsed by YAML as a Boolean and only
        # reaches the enum via Spring Boot's lenient Object-to-enum coercion. The quotes make it a
        # String and remove the dependency on that coercion.
        think: "false"
        # Gemma 4's own Modelfile sets temperature 1, top_k 64, top_p 0.95, and - exactly as with
        # repeat-penalty below - Spring AI sends NO value unless one is set here, so omitting this
        # silently runs grounded RAG at temperature 1.0. llama3.2 shipped no temperature at all, so
        # this is a difference the model swap introduces rather than one inherited from it.
        temperature: 0.2
        # Nothing else bounds an answer: without num-predict the only stop condition is the context
        # window, so a looping generation runs to (num-ctx - prompt) tokens. One request generated
        # 13,468 tokens over 29 minutes before it was killed, holding the HTTP thread the whole time.
        # 1024 is comfortably above what this model needs once `think` is off (max measured 837).
        num-predict: 1024
        # Ollama's API default is 1.1, but Spring AI sends no value unless one is set here, and
        # llama.cpp's own default is 1.0 - i.e. repetition penalty DISABLED. The runaway above ran
        # with `repeat_penalty = 1.000` in the sampler params. Do not remove this.
        repeat-penalty: 1.1
        # 8192, far below the 131072 this model reports as its native context: the KV cache is what
        # made Ollama predict 3.6 GiB for the previous chat model and evict nomic-embed-text to fit
        # it. Must stay well above the worst-case prompt - system prompt + top-k(5) chunks of up to
        # 445 tokens + max-chat-messages(10) of history - because Ollama truncates an over-long
        # prompt from the left, which silently drops the system prompt and the RAG context rather
        # than failing. Measured prompts on the manual reach ~2,430 tokens, so there is ample room.
        num-ctx: 8192
    chat:
      # ChatModel-level: the FINAL prompt sent to Ollama, i.e. after QuestionAnswerAdvisor
      # has injected the retrieved document context. This is where the RAG context shows up.
      observations:
        log-prompt: true
        log-completion: true
        include-error-logging: true
      client:
        # ChatClient-level: the prompt as the caller wrote it, before advisors run.
        observations:
          log-prompt: true
          log-completion: true

logging:
  level:
    org:
      springframework:
        ai:
          vectorstore: DEBUG
          chat:
            client:
              advisor: DEBUG
        jdbc:
          core: DEBUG

#app configurations
app:
  rag:
    chunk-size: 400
    min-chunk-size-chars: 150
    min-chunk-length-to-embed: 100   # characters; a shorter chunk is MERGED into the one before it, never
                                     # dropped - the splitter's own discard behaviour deleted real content
    max-num-chunks: 10000
    max-embed-tokens: 2048       # nomic-embed-text's context; a chunk above this is truncated by Ollama
                                 # before embedding, so only an unsplittable table row may exceed it
    top-k: 5
    similarity-threshold: 0.6
    batch-size: 35               # chunks per batch; cost scales with TOKENS, not chunk count. At the
                                 # current mean of 279 tokens/chunk this carries ~10k tokens per batch,
                                 # the weight the Hikari pool was sized against. Re-check it whenever
                                 # chunk sizing changes.
    ingestion-concurrency: 4
    ingestion-max-attempts: 3      # only for an unreachable Ollama model runner; other failures fail fast
    ingestion-retry-backoff: 2s    # doubled on each further attempt
    table-detection: auto         # off | auto | lattice | stream. AUTO picks per page: ruled pages take
                                 # columns from the rules, unruled ones from text alignment. This replaces
                                 # the PDF reader entirely, so prose extraction changes too - documents
                                 # ingested before it was turned on need re-uploading.
  ai: # New section for Spring AI properties
    max-chat-messages: 10

  eval:
    enabled: true
    # The SAME model the chat path uses, and that is a memory decision rather than a quality one.
    # Measured on this host: gemma4:e2b is resident at 1.59 GiB and nomic-embed-text at 0.30 GiB,
    # leaving 0.74 GB free of 15.63 GB total (2.81 GB with nothing loaded). The smallest purpose-built
    # grounded-factuality judge, bespoke-minicheck, ships only at 7B with a 4.39 GiB weights layer - it
    # does not fit even after evicting BOTH resident models, so every judgement would page to disk.
    # Reusing the chat model evicts nothing and costs nothing.
    #
    # The price is self-judging bias: a model grading its own output is more generous than an
    # independent one, so these rates are optimistic in absolute terms. Read them as a TREND - the bias
    # is a roughly constant offset, so a drop after a prompt or model change is real - and never quote
    # the absolute number as a quality score.
    judge-model: gemma4:e2b
    # Pinned for the same reason the chat path pins it: Spring AI sends NO temperature unless one is
    # set here, and Gemma's Modelfile defaults to 1.0. A judge sampling at 1.0 returns different
    # verdicts for the same answer on consecutive runs, turning a regression signal into noise.
    judge-temperature: 0.0
    # A judge's whole answer is one word. Without a cap, a judge that starts explaining itself holds
    # Ollama's single runner slot for minutes - and on the online path that delays a real user.
    judge-num-predict: 8
    # Must hold the retrieved context plus the answer being judged. Ollama truncates an over-long
    # prompt FROM THE LEFT, which would silently drop the context the judgement is about and produce a
    # confident wrong verdict rather than an error.
    judge-num-ctx: 8192
    online:
      enabled: true
      # Deterministic metrics (citations, zero-hit, score spread, refusals) run on 100% of turns
      # regardless of this - they are regex over data already in the response and cost microseconds.
      # This rate governs only the LLM judges. Judging never blocks the caller that triggered it, but
      # it is NOT free to the system: Ollama serialises on one runner slot, so a judge call occupies
      # the chat model and the NEXT user's generation queues behind it. Set 0.0 to keep the free
      # metrics and switch the model calls off entirely.
      judge-sample-rate: 0.1
      # One in flight at a time, so the worst case is a single queued generation rather than a pile-up.
      # Admission is non-blocking - over this bound a judgement is DROPPED and counted, never queued.
      # A rising rag_eval_online_judgements_dropped_total means the sample rate is too high for the
      # traffic, not that anything is broken.
      max-concurrent-judgements: 1
      judge-timeout-seconds: 120
    golden:
      dataset-location: classpath:eval/golden-dataset.yaml
      # Judging roughly triples a run's wall clock. Off by default so the tagged test stays a quick
      # retrieval-and-citation regression check; the test can switch it on explicitly.
      judged: false
      persist: true