server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  ring:
    kvstore:
      store: inmemory

storage:
  trace:
    backend: local
    local:
      path: /var/tempo

metrics_generator:
  processor:
    service_graphs: {}
    span_metrics: {}
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

# Configuring `metrics_generator` above does NOT switch it on: processors are enabled
# per tenant via overrides. Without this block the generator stays idle and the
# Tempo datasource's serviceMap / tracesToMetrics have no metrics to query.
overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics