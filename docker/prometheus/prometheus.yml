global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'spring-ai-ragr'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # Use host.docker.internal to allow the Prometheus container to scrape the Spring Boot app running on the host machine.
      - targets: ['host.docker.internal:9095']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # The chat service's two siblings, each run as its own application. Every Spring application tags its
  # meters with application=<spring.application.name> - spring-ai-ragr, ragr-ingest, ragr-eval - and
  # the dashboards select on that tag, so a metric moving between applications empties any panel still
  # selecting the old one.
  - job_name: 'ragr-ingest'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:9097']

  - job_name: 'ragr-eval'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:9096']
