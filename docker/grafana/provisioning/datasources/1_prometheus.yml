apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    uid: prometheus
    editable: false
    jsonData:
      # Metrics -> Traces. The exemplar label emitted by Micrometer is `trace_id`
      # (verified in /actuator/prometheus: `# {span_id="...",trace_id="..."}`).
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

    # Metrics -> Logs. Grafana has no built-in link for this, so it is a Correlation: a link on a
    # named field of the result that queries another datasource. Provisioned here, under the source
    # datasource - Grafana reads no provisioning/correlations/ directory. `$${...}` escapes
    # provisioning's own interpolation, leaving `${...}`, a field of the Prometheus result.
    correlations:
      # Click the `job` field on any Prometheus series -> that service's logs.
      - targetUID: loki
        label: App logs
        description: Loki logs for the service this series belongs to
        config:
          type: query
          field: job
          target:
            expr: '{app="$${job}"}'
      #
      # A per-endpoint link on the `uri` label was tried and removed: no log line contains the URI.
      # To make it work, put the URI in MDC, emit it as structured metadata in logback-spring.xml, and
      # key the correlation on that.