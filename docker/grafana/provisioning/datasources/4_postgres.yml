apiVersion: 1

# Postgres, read-only, for what only the database holds: the evaluation dashboard's turns, cases and
# runs, and the ingestion dashboard's upload timings from document_metadata_history.
#
# A gauge can say citation validity fell; only a row can say which case failed, what it answered and
# which page it invented. In Prometheus that would mean a label per case and answer text as a label
# value - the way to wreck a metrics store.
#
# By the compose service name and internal port: Grafana resolves it on the compose network.
datasources:
  - name: Postgres
    # The plugin id exactly as Grafana registers it - NOT the old `postgres`, which has no alias (13.2.1).
    # A dashboard panel typed `postgres` renders empty in the browser while /api/ds/query still answers,
    # so testing a panel through the API proves nothing about whether it renders.
    type: grafana-postgresql-datasource
    uid: postgres
    access: proxy
    url: pgvector:5432
    user: myuser
    # Set in BOTH places on purpose. The backend reads this one; the browser reads jsonData.database,
    # and without it every panel is completely blank - no error, only a browser console message - while
    # every server-side test passes.
    database: ragdatabase
    editable: false
    secureJsonData:
      # The applications' local development credentials, already in compose.yaml. Anything real belongs
      # in an environment variable.
      password: secret
    jsonData:
      # The location the browser actually reads - see the note above.
      database: ragdatabase
      sslmode: disable
      postgresVersion: 1600
      # Bounded, so a refreshing dashboard cannot crowd out the applications' own connections.
      maxOpenConns: 4
      maxIdleConns: 2
      connMaxLifetime: 14400
      # Meant to be read-only, which Grafana cannot enforce. If this stack ever leaves a laptop, use a
      # role with SELECT only on the eval schema and public.document_metadata_history.
      timescaledb: false
